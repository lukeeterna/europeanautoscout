<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060a"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a446"/>
      <stop offset="100%" stop-color="#e8c870"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Top gold line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#gold)" opacity="0.7"/>
  <!-- Grid subtle -->
  <g opacity="0.02" stroke="#c8a446" stroke-width="0.5" fill="none">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- Central glow -->
  <ellipse cx="600" cy="280" rx="400" ry="200" fill="rgba(200,164,70,0.03)"/>
  <!-- Tag line -->
  <g transform="translate(600, 170)">
    <line x1="-120" y1="0" x2="-90" y2="0" stroke="#c8a446" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#c8a446" letter-spacing="5">VEHICLE SOURCING · MERCATI EU</text>
    <line x1="90" y1="0" x2="120" y2="0" stroke="#c8a446" stroke-width="1"/>
  </g>
  <!-- Main heading -->
  <text x="600" y="270" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="54" font-weight="300" fill="#e8e8f0">Trovo auto premium</text>
  <text x="600" y="330" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="54" font-weight="300" fill="#e8e8f0">in Europa.</text>
  <text x="600" y="395" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="48" font-weight="300" fill="#c8a446" font-style="italic">Paghi solo a buon fine.</text>
  <!-- Stats -->
  <g transform="translate(280, 500)">
    <text x="0" y="0" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#e8e8f0">7+</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#68687a" letter-spacing="2">MERCATI EU</text>
  </g>
  <g transform="translate(600, 500)">
    <text x="0" y="0" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#e8e8f0">48h</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#68687a" letter-spacing="2">PRIMA PROPOSTA</text>
  </g>
  <g transform="translate(920, 500)">
    <text x="0" y="0" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#c8a446">€0</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#68687a" letter-spacing="2">SE NON SI CONCLUDE</text>
  </g>
  <!-- Bottom bar -->
  <rect x="0" y="570" width="1200" height="60" fill="rgba(200,164,70,0.06)"/>
  <text x="600" y="605" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#e8e8f0" letter-spacing="3">LUCA FERRETTI</text>
  <!-- Bottom gold line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#gold)" opacity="0.5"/>
</svg>