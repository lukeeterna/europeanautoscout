name: ARGOS C10T1 Production Cutover

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character C10T1 candidate SHA
        required: true
        type: string
      confirm:
        description: Type DEPLOY_PAUSED_NO_OUTBOUND
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: argos-c10t1-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    name: Exact-SHA PAUSED Cloud cutover
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CUTOVER_CONFIRM: ${{ inputs.confirm }}
      IMAC_HOST: ${{ secrets.IMAC_HOST }}
      IMAC_USER: ${{ secrets.IMAC_USER }}
      IMAC_SSH_KEY: ${{ secrets.IMAC_SSH_KEY }}
    steps:
      - name: Validate explicit authorization and SSH lane
        run: |
          set -euo pipefail
          test "$CUTOVER_CONFIRM" = 'DEPLOY_PAUSED_NO_OUTBOUND'
          case "$CANDIDATE_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo 'candidate_sha must be exactly 40 lowercase hex characters' >&2; exit 2 ;;
          esac
          test -n "$IMAC_HOST"
          test -n "$IMAC_USER"
          test -n "$IMAC_SSH_KEY"
          echo 'CUTOVER_AUTHORIZATION=PASS'

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify exact SHA and certified S292 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1)"
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['CANDIDATE_SHA']
          token = os.environ['GH_TOKEN']
          url = f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&status=completed&per_page=100"
          req = urllib.request.Request(
              url,
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              payload = json.load(r)
          matches = [
              row for row in payload.get('workflow_runs', [])
              if row.get('name') == 'ARGOS S292 Production Contract'
              and row.get('head_sha') == sha
              and row.get('conclusion') == 'success'
          ]
          if not matches:
              raise SystemExit('No successful ARGOS S292 Production Contract run for exact candidate SHA')
          print(f"EXACT_SHA_S292_GREEN=PASS run_id={matches[0]['id']}")
          PY

      - name: C10T1 exact-SHA cutover on iMac
        id: imac_cutover
        uses: appleboy/ssh-action@v1.0.3
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        with:
          host: ${{ secrets.IMAC_HOST }}
          username: ${{ secrets.IMAC_USER }}
          key: ${{ secrets.IMAC_SSH_KEY }}
          port: 22
          command_timeout: 25m
          envs: CANDIDATE_SHA
          script: |
            set -eu
            export PATH="/usr/local/bin:$HOME/.npm-global/bin:$PATH"
            umask 077

            REPO_URL='https://github.com/lukeeterna/europeanautoscout.git'
            RELEASES="$HOME/Documents/argos-releases"
            RELEASE="$RELEASES/$CANDIDATE_SHA"
            BACKUPS="$HOME/Documents/argos-backups/c10t1/$CANDIDATE_SHA"
            mkdir -p "$RELEASES" "$BACKUPS"

            cleanup_failed_cutover() {
              code=$?
              trap - ERR
              echo "C10T1_CUTOVER_FAILED=$code" >&2
              pm2 delete argos-wa-daemon >/dev/null 2>&1 || true
              pm2 delete argos-outreach-scheduler >/dev/null 2>&1 || true
              echo 'FAIL_CLOSED_NEW_RUNTIME=STOPPED' >&2
              echo 'LEGACY_RUNTIME_RESTORED=NO' >&2
              echo 'OUTREACH_ACTIVATED=NO' >&2
              exit "$code"
            }
            trap cleanup_failed_cutover ERR

            if [ ! -d "$RELEASE/.git" ]; then
              test ! -e "$RELEASE" || { echo 'release path exists but is not a Git repository' >&2; exit 20; }
              git clone --no-checkout "$REPO_URL" "$RELEASE"
            fi
            git -C "$RELEASE" remote set-url origin "$REPO_URL"
            git -C "$RELEASE" fetch --prune origin
            git -C "$RELEASE" cat-file -e "$CANDIDATE_SHA^{commit}"
            git -C "$RELEASE" checkout --detach --force "$CANDIDATE_SHA"
            test "$(git -C "$RELEASE" rev-parse HEAD)" = "$CANDIDATE_SHA"
            test -z "$(git -C "$RELEASE" status --porcelain=v1)"

            ENV_SRC=''
            for candidate in \
              "$HOME/Documents/combaretrovamiauto-enterprise/wa-intelligence/.env" \
              "$HOME/Documents/app-antigravity-auto/wa-intelligence/.env"; do
              if [ -f "$candidate" ]; then
                if [ -n "$ENV_SRC" ]; then
                  echo 'multiple historical .env candidates found; refusing to guess' >&2
                  exit 21
                fi
                ENV_SRC="$candidate"
              fi
            done
            test -n "$ENV_SRC" || { echo 'no historical production .env found' >&2; exit 22; }
            cp -p "$ENV_SRC" "$RELEASE/wa-intelligence/.env"
            chmod 600 "$RELEASE/wa-intelligence/.env"

            python3 - "$RELEASE/wa-intelligence/.env" <<'PY'
            import os, pathlib, sys, urllib.parse
            path = pathlib.Path(sys.argv[1])
            env = {}
            for raw in path.read_text(encoding='utf-8').splitlines():
                line = raw.strip()
                if not line or line.startswith('#') or '=' not in line:
                    continue
                k, v = line.split('=', 1)
                v = v.strip()
                if len(v) >= 2 and v[0] == v[-1] and v[0] in {'"', "'"}:
                    v = v[1:-1]
                env[k.strip()] = v
            required = [
                'ARGOS_DB_PATH','BRIDGE_DB_PATH','ARGOS_API_KEY',
                'META_WA_ACCESS_TOKEN','META_WA_PHONE_NUMBER_ID','META_WA_WABA_ID',
                'META_WA_WEBHOOK_VERIFY_TOKEN','META_APP_SECRET','ARGOS_WA_WEBHOOK_PUBLIC_URL',
                'META_WA_TEMPLATE_DAY1_NAME','META_WA_TEMPLATE_DAY7_NAME','META_WA_TEMPLATE_DAY12_NAME',
            ]
            missing = [k for k in required if not env.get(k, '').strip()]
            if missing:
                raise SystemExit('missing required local production settings: ' + ','.join(missing))
            if env.get('ARGOS_WA_TRANSPORT', '').strip().lower() != 'cloud':
                raise SystemExit('ARGOS_WA_TRANSPORT must be cloud')
            if env.get('ARGOS_AUTOMATION_ENABLED', '0').strip() == '1':
                raise SystemExit('ARGOS_AUTOMATION_ENABLED must remain 0')
            parsed = urllib.parse.urlsplit(env['ARGOS_WA_WEBHOOK_PUBLIC_URL'])
            if parsed.scheme != 'https' or not parsed.netloc:
                raise SystemExit('ARGOS_WA_WEBHOOK_PUBLIC_URL must be public HTTPS')
            for key in ('ARGOS_DB_PATH', 'BRIDGE_DB_PATH'):
                p = pathlib.Path(os.path.expanduser(env[key])).resolve()
                if not p.is_file():
                    raise SystemExit(f'{key} does not point to an existing file')
            mode = path.stat().st_mode & 0o777
            if mode & 0o077:
                raise SystemExit('.env is not private')
            print('LOCAL_ENV_FAIL_CLOSED=PASS')
            PY

            npm ci --prefix "$RELEASE/wa-intelligence" --omit=optional --no-audit --no-fund
            npm --prefix "$RELEASE/wa-intelligence" run verify:runtime-deps

            /usr/local/bin/python3.13 "$RELEASE/tools/scripts/argos_c10_smoke.py" \
              --mode predeploy \
              --repo-root "$RELEASE" \
              --expected-head "$CANDIDATE_SHA" \
              --pretty

            PRIMARY_DB="$(python3 - "$RELEASE/wa-intelligence/.env" ARGOS_DB_PATH <<'PY'
            import os, pathlib, sys
            env = {}
            for raw in pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
                line = raw.strip()
                if not line or line.startswith('#') or '=' not in line:
                    continue
                k, v = line.split('=', 1)
                v = v.strip().strip('"').strip("'")
                env[k.strip()] = v
            print(pathlib.Path(os.path.expanduser(env[sys.argv[2]])).resolve())
            PY
            )"
            BRIDGE_DB="$(python3 - "$RELEASE/wa-intelligence/.env" BRIDGE_DB_PATH <<'PY'
            import os, pathlib, sys
            env = {}
            for raw in pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
                line = raw.strip()
                if not line or line.startswith('#') or '=' not in line:
                    continue
                k, v = line.split('=', 1)
                v = v.strip().strip('"').strip("'")
                env[k.strip()] = v
            print(pathlib.Path(os.path.expanduser(env[sys.argv[2]])).resolve())
            PY
            )"

            OUTBOUND_BEFORE="$(python3 - "$PRIMARY_DB" <<'PY'
            import sqlite3, sys
            uri = 'file:' + sys.argv[1] + '?mode=ro'
            con = sqlite3.connect(uri, uri=True)
            try:
                print(con.execute("SELECT COUNT(*) FROM messages WHERE direction='OUTBOUND'").fetchone()[0])
            finally:
                con.close()
            PY
            )"

            stamp="$(date -u '+%Y%m%dT%H%M%SZ')"
            backup="$BACKUPS/$stamp"
            mkdir -p "$backup"
            cp -p "$PRIMARY_DB" "$backup/primary.sqlite"
            cp -p "$BRIDGE_DB" "$backup/bridge.sqlite"
            shasum -a 256 "$backup/primary.sqlite" "$backup/bridge.sqlite" > "$backup/SHA256SUMS"
            echo "STATE_BACKUP=PASS:$backup"

            LEGACY_PLIST="$HOME/Library/LaunchAgents/com.argos.scheduler.plist"
            if [ -f "$LEGACY_PLIST" ]; then
              launchctl unload "$LEGACY_PLIST" >/dev/null 2>&1 || true
            fi

            pm2 delete argos-wa-daemon >/dev/null 2>&1 || true
            pm2 delete argos-outreach-scheduler >/dev/null 2>&1 || true

            cd "$RELEASE/wa-intelligence"
            pm2 start ecosystem.config.js --only argos-wa-daemon
            pm2 start ecosystem.config.js --only argos-outreach-scheduler

            /usr/local/bin/python3.13 "$RELEASE/tools/scripts/argos_c10_smoke.py" \
              --mode postdeploy \
              --repo-root "$RELEASE" \
              --expected-head "$CANDIDATE_SHA" \
              --require-connected \
              --pretty

            OUTBOUND_AFTER="$(python3 - "$PRIMARY_DB" <<'PY'
            import sqlite3, sys
            uri = 'file:' + sys.argv[1] + '?mode=ro'
            con = sqlite3.connect(uri, uri=True)
            try:
                print(con.execute("SELECT COUNT(*) FROM messages WHERE direction='OUTBOUND'").fetchone()[0])
            finally:
                con.close()
            PY
            )"
            test "$OUTBOUND_AFTER" = "$OUTBOUND_BEFORE"
            echo "OUTBOUND_DELTA=0"

            health="$(curl -fsS --max-time 5 http://127.0.0.1:9191/health)"
            printf '%s' "$health" | python3 - <<'PY'
            import json, sys
            d = json.load(sys.stdin)
            assert d.get('runtime') == 'argos-s292-single-writer'
            assert d.get('transport') == 'cloud'
            assert d.get('agent_status') == 'PAUSED'
            assert d.get('connected') is True
            assert d.get('bridge_enabled') is True
            print('FINAL_HEALTH=PASS')
            PY

            pm2 save
            trap - ERR
            echo "C10T1_PRODUCTION_CUTOVER=PASS"
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo 'RUNTIME_STATUS=PAUSED'
            echo 'ARGOS_AUTOMATION_ENABLED=0'
            echo 'OUTBOUND_DELTA=0'
            echo 'LEGACY_RUNTIME_RESTORED=NO'

      - name: Publish successful PAUSED cutover on PR 3
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/comment.json
          import json, os
          sha = os.environ['CANDIDATE_SHA']
          body = (
              f"C10T1_PRODUCTION_CUTOVER=PASS\nHEAD={sha}\n"
              "RUNTIME_STATUS=PAUSED\nARGOS_AUTOMATION_ENABLED=0\nOUTBOUND_DELTA=0\n"
              "C11_REAL_SEND=NOT_EXECUTED"
          )
          print(json.dumps({'body': body}))
          PY
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/3/comments" \
            --data-binary @/tmp/comment.json >/dev/null
