name: ARGOS S292 Production Contract

on:
  push:
    branches:
      - sol/argos-canonicalization-20260817
      - sol/argos-cloudapi-c10t1-gpt56
    paths:
      - 'src/cove/**'
      - 'wa-intelligence/**'
      - 'tools/scripts/pdf_generator_enterprise.py'
      - 'tools/scripts/argos_dealer_delivery.py'
      - 'tools/scripts/argos_c10_smoke.py'
      - 'tests/test_argos_*.py'
      - '.github/workflows/argos-s292-contract.yml'
  pull_request:
    paths:
      - 'src/cove/**'
      - 'wa-intelligence/**'
      - 'tools/scripts/pdf_generator_enterprise.py'
      - 'tools/scripts/argos_dealer_delivery.py'
      - 'tools/scripts/argos_c10_smoke.py'
      - 'tests/test_argos_*.py'
      - '.github/workflows/argos-s292-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    name: Offline S292 production contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Compile production Python modules
        run: |
          python -m py_compile \
            src/cove/demand_contract.py \
            src/cove/deal_economics.py \
            src/cove/demand_orchestrator.py \
            src/cove/dealer_matcher.py \
            src/cove/dossier_standard.py \
            src/cove/seller_contact.py \
            src/cove/photo_coverage.py \
            src/cove/second_brain_contract.py \
            src/cove/db_schema.py \
            src/cove/argos_grade.py \
            wa-intelligence/demand_capture.py \
            wa-intelligence/state_machine.py \
            wa-intelligence/templates.py \
            wa-intelligence/s292_outbound_policy.py \
            wa-intelligence/outbound_guard.py \
            wa-intelligence/response-analyzer.py \
            wa-intelligence/post_send_update.py \
            wa-intelligence/outreach_scheduler.py \
            wa-intelligence/runtime_entrypoint.py \
            tools/scripts/pdf_generator_enterprise.py \
            tools/scripts/argos_dealer_delivery.py \
            tools/scripts/argos_c10_smoke.py

      - name: Parse Node production configuration
        run: |
          node --check wa-intelligence/wa-daemon.js
          node --check wa-intelligence/ecosystem.config.js
          node --check wa-intelligence/transport/index.js
          node --check wa-intelligence/transport/errors.js
          node --check wa-intelligence/transport/cloud_api_transport.js
          node --check wa-intelligence/transport/wwebjs_transport.js
          node --check wa-intelligence/transport/webhook.js

      - name: Validate C10 smoke CLI is side-effect free on help
        run: python tools/scripts/argos_c10_smoke.py --help >/dev/null

      - name: Run full ARGOS offline production suite
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v \
            tests.test_argos_s292_contract \
            tests.test_argos_demand_orchestrator \
            tests.test_argos_wa_policy \
            tests.test_argos_photo_second_brain \
            tests.test_argos_demand_capture \
            tests.test_argos_runtime_production \
            tests.test_argos_delivery_artifact \
            tests.test_argos_runtime_entrypoint \
            tests.test_argos_c10_transport_smoke

      - name: Run C10T1 Cloud transport tests
        run: node --test wa-intelligence/transport/tests/*.test.js

      - name: Assert single guarded WhatsApp transport boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('wa-intelligence')
          daemon_path = root / 'wa-daemon.js'
          legacy_path = root / 'transport' / 'wwebjs_transport.js'
          daemon = daemon_path.read_text(encoding='utf-8')

          marker = 'async function guardedSend('
          end_marker = '\nfunction persistInbound('
          assert marker in daemon and end_marker in daemon, 'guardedSend boundary missing'
          start = daemon.index(marker)
          end = daemon.index(end_marker, start)
          guarded = daemon[start:end]

          assert 'client.sendMessage(' not in daemon, 'raw whatsapp-web.js send leaked back into daemon'

          transport_needles = ('activeTransport.sendText(', 'activeTransport.sendDocument(')
          occurrences = []
          for needle in transport_needles:
              offset = 0
              while True:
                  idx = daemon.find(needle, offset)
                  if idx < 0:
                      break
                  occurrences.append((needle, idx))
                  offset = idx + len(needle)
          assert occurrences, 'transport send delegation missing from daemon'
          assert all(start <= idx < end for _, idx in occurrences), (
              f'transport send outside guardedSend: {occurrences}'
          )
          assert 'activeTransport.sendText(' in guarded, 'guardedSend text delegation missing'
          assert 'activeTransport.sendDocument(' in guarded, 'guardedSend document delegation missing'

          assert "url.pathname === '/send'" in daemon and "url.pathname === '/send-doc'" in daemon
          assert daemon.count('guardedSend({') >= 3, 'bridge/send/send-doc must route through guardedSend'
          assert "url.pathname === '/send-multi'" in daemon
          assert "url.pathname === '/send-voice'" in daemon
          assert 'LEGACY_TRANSPORT_RETIRED' in daemon, 'legacy multi/voice transport not retired'

          allowed_raw_send = legacy_path.as_posix()
          raw_send_files = []
          for path in root.rglob('*.js'):
              rel = path.as_posix()
              if '/node_modules/' in f'/{rel}/' or '/tests/' in f'/{rel}/' or rel.endswith('.test.js'):
                  continue
              if 'client.sendMessage(' in path.read_text(encoding='utf-8'):
                  raw_send_files.append(rel)
          assert raw_send_files == [allowed_raw_send], (
              f'raw client.sendMessage allowed only in legacy adapter, found {raw_send_files}'
          )
          legacy = legacy_path.read_text(encoding='utf-8')
          assert legacy.count('client.sendMessage(') >= 1, 'legacy adapter transport primitive missing'

          webhook_start = daemon.index('async function handleWebhook(')
          webhook_end = daemon.index('\nasync function handleHttp(', webhook_start)
          webhook = daemon[webhook_start:webhook_end]
          for forbidden in ('activeTransport.sendText(', 'activeTransport.sendDocument(', 'guardedSend('):
              assert forbidden not in webhook, f'webhook became outbound trigger via {forbidden}'

          for path in root.rglob('*.js'):
              rel = path.as_posix()
              if rel == daemon_path.as_posix() or '/tests/' in f'/{rel}/' or '/node_modules/' in f'/{rel}/':
                  continue
              text = path.read_text(encoding='utf-8')
              assert 'activeTransport.sendText(' not in text and 'activeTransport.sendDocument(' not in text, (
                  f'non-daemon consumer bypasses guardedSend in {rel}'
              )

          print(
              'PASS guardedSend owns adapter sends; raw wwebjs primitive is confined to '
              f'{allowed_raw_send}'
          )
          PY

      - name: Assert dealer-delivery sidecar matches daemon contract
        run: |
          python - <<'PY'
          from pathlib import Path
          delivery = Path('tools/scripts/argos_dealer_delivery.py').read_text(encoding='utf-8')
          daemon = Path('wa-intelligence/wa-daemon.js').read_text(encoding='utf-8')
          for key in ('dealer_ready', 'dealer_id', 'evidence_id', 'file_sha256'):
              assert f'"{key}"' in delivery, f'delivery sidecar missing key {key}'
              assert key in daemon, f'daemon metadata verifier missing key {key}'
          assert '.metadata.json' in delivery, 'deterministic sidecar suffix missing'
          assert 'verifyDossierMetadata' in daemon, 'daemon dossier verifier missing'
          print('PASS dealer-delivery sidecar and daemon use the same transport contract')
          PY

      - name: Assert PM2 starts fail-closed single writer
        run: |
          python - <<'PY'
          from pathlib import Path
          ecosystem = Path('wa-intelligence/ecosystem.config.js').read_text(encoding='utf-8')
          entry = Path('wa-intelligence/runtime_entrypoint.py').read_text(encoding='utf-8')
          assert "script: path.join(INTEL, 'runtime_entrypoint.py')" in ecosystem
          assert "'agent_status', 'PAUSED'" in entry
          assert "os.execv(node, [node, str(daemon)])" in entry
          assert 'client.sendMessage(' not in entry
          assert "ARGOS_WA_TRANSPORT: dotEnv.ARGOS_WA_TRANSPORT || 'wwebjs'" in ecosystem
          for key in (
              'META_WA_ACCESS_TOKEN',
              'META_WA_PHONE_NUMBER_ID',
              'META_WA_WABA_ID',
              'META_WA_WEBHOOK_VERIFY_TOKEN',
              'META_APP_SECRET',
          ):
              assert key in ecosystem, f'PM2 does not pass {key}'
          print('PASS PM2 first boot is PAUSED, transport-aware and execs the only writer')
          PY

      - name: Static anti-drift assertions
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          checked_multiplier_files = [
              Path('tools/scripts/pdf_generator_enterprise.py'),
              Path('src/cove/deal_economics.py'),
              Path('src/cove/dossier_standard.py'),
          ]
          forbidden_multipliers = {1.12, 1.15}
          for path in checked_multiplier_files:
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.BinOp) and isinstance(node.op, ast.Mult):
                      for side in (node.left, node.right):
                          if isinstance(side, ast.Constant) and isinstance(side.value, (int, float)):
                              assert float(side.value) not in forbidden_multipliers, (
                                  f'forbidden inferred market uplift {side.value} in {path}:{getattr(node, "lineno", "?")}'
                              )

          for path in [
              Path('wa-intelligence/templates.py'),
              Path('wa-intelligence/response-analyzer.py'),
              Path('src/cove/demand_contract.py'),
              Path('src/cove/second_brain_contract.py'),
          ]:
              text = path.read_text(encoding='utf-8').lower()
              assert 'cliente fittizio' not in text, f'false handoff language in {path}'
              assert 'mystery_shopper' not in text and 'mystery shopper' not in text, (
                  f'synthetic handoff path in {path}'
              )

          pdf = Path('tools/scripts/pdf_generator_enterprise.py').read_text(encoding='utf-8')
          forbidden_default_patterns = [
              r'fuel_type:\s*str\s*=\s*["\'](?:Diesel|Benzina)["\']',
              r'transmission:\s*str\s*=\s*["\']Automatico["\']',
              r'color:\s*str\s*=\s*["\']Grigio["\']',
              r'city\s*=\s*["\']Sud Italia["\']',
          ]
          for pattern in forbidden_default_patterns:
              assert not re.search(pattern, pdf), f'forbidden PDF default: {pattern}'

          print('PASS semantic anti-drift assertions')
          PY
