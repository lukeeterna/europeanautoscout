name: ARGOS C10 TEMP Pairing Read-Only Diagnostic

on:
  push:
    branches:
      - s210/audit-master-plan
    paths:
      - .github/workflows/argos-c10-temp-pairing-diag.yml

permissions:
  contents: read

concurrency:
  group: argos-c10-pairing-readonly-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, macbook, argos]
    timeout-minutes: 5
    steps:
      - name: Probe isolated Puppeteer launch from iMac
        shell: bash
        run: |
          set -euo pipefail
          echo 'DIAG_MUTATION=TEMP_ONLY'
          echo 'PRODUCTION_MUTATION=NONE'
          echo 'OUTBOUND_ACTION=NONE'
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            gianlucadistasi@iMac-di-gianluca.local \
            "bash -s -- '5dd932e6ab27a43b5486afbd41c18396e5d15830'" <<'REMOTE'
          set -euo pipefail
          SHA="$1"
          export PATH="$HOME/.npm-global/bin:/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin:${PATH:-}"
          ROOT="$HOME/Documents/argos-c10-release-${SHA:0:12}/wa-intelligence"
          CFT="$HOME/.cache/puppeteer/chrome/mac-148.0.7778.97/chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          STABLE="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          test -d "$ROOT/node_modules/puppeteer"
          echo "DIAG_EXPECTED_SHA=$SHA"
          failures=0
          for spec in "CFT|$CFT" "STABLE|$STABLE"; do
            label="${spec%%|*}"
            binary="${spec#*|}"
            test -x "$binary"
            "$binary" --version | sed "s/^/DIAG_${label}_VERSION=/"
            profile="$(mktemp -d /tmp/argos-pair-diag.XXXXXX)"
            export ARGOS_DIAG_PROFILE="$profile"
            set +e
            node - "$ROOT" "$binary" "$label" <<'NODE'
          const path=require('path');
          const root=process.argv[2], binary=process.argv[3], label=process.argv[4];
          const puppeteer=require(path.join(root,'node_modules','puppeteer'));
          const watchdog=setTimeout(()=>{
            console.log('DIAG_'+label+'_PUPPETEER=TIMEOUT');
            process.exit(124);
          },45000);
          (async()=>{
            const browser=await puppeteer.launch({
              headless:true,
              executablePath:binary,
              userDataDir:process.env.ARGOS_DIAG_PROFILE,
              args:['--no-first-run','--no-default-browser-check']
            });
            try {
              console.log('DIAG_'+label+'_PUPPETEER_LAUNCH=PASS');
              const page=await browser.newPage();
              const response=await page.goto('https://web.whatsapp.com/',{
                waitUntil:'domcontentloaded',
                timeout:30000
              });
              console.log('DIAG_'+label+'_PUPPETEER_HTTP='+(response ? response.status() : 'NONE'));
            } finally {
              await browser.close();
              clearTimeout(watchdog);
            }
          })().catch(e=>{
            console.log('DIAG_'+label+'_PUPPETEER_ERROR='+e.name);
            process.exit(20);
          });
          NODE
            rc=$?
            set -e
            rm -rf "$profile"
            echo "DIAG_${label}_PUPPETEER_RC=$rc"
            if [ "$label" = STABLE ] && [ "$rc" -ne 0 ]; then failures=1; fi
          done
          test "$failures" -eq 0
          authroot="$(mktemp -d /tmp/argos-wwebjs-diag.XXXXXX)"
          export ARGOS_DIAG_AUTH="$authroot"
          set +e
          node - "$ROOT" "$STABLE" <<'NODE'
          const path=require('path');
          const root=process.argv[2], binary=process.argv[3];
          const {Client,LocalAuth}=require(path.join(root,'node_modules','whatsapp-web.js'));
          const client=new Client({
            authStrategy:new LocalAuth({clientId:'argos-diagnostic',dataPath:process.env.ARGOS_DIAG_AUTH}),
            puppeteer:{headless:true,executablePath:binary,args:['--no-first-run','--no-default-browser-check']}
          });
          let terminal=false;
          const done=async(code,label)=>{
            if(terminal)return; terminal=true;
            console.log('DIAG_WWEBJS_TERMINAL='+label);
            try{await Promise.race([client.destroy(),new Promise((_,r)=>setTimeout(()=>r(Error()),10000))]);}
            catch(_){console.log('DIAG_WWEBJS_DESTROY=FAILED');}
            process.exit(code);
          };
          client.on('qr',()=>done(0,'QR_EVENT'));
          client.on('authenticated',()=>console.log('DIAG_WWEBJS_AUTHENTICATED=YES'));
          client.on('ready',()=>done(0,'READY'));
          client.on('auth_failure',()=>done(21,'AUTH_FAILURE'));
          client.on('disconnected',()=>done(22,'DISCONNECTED'));
          setTimeout(()=>{
            const url=client.pupPage && client.pupPage.url ? client.pupPage.url() : 'NO_PAGE';
            console.log('DIAG_WWEBJS_PAGE='+(url.startsWith('https://web.whatsapp.com')?'WA_WEB':'OTHER'));
            done(23,'NO_EVENT_TIMEOUT');
          },60000);
          client.initialize().catch(e=>done(24,'INIT_ERROR_'+e.name));
          NODE
          wrc=$?
          set -e
          rm -rf "$authroot"
          echo "DIAG_WWEBJS_RC=$wrc"
          test "$wrc" -eq 0
          echo 'PAIRING_DIAGNOSTIC=PASS_READ_ONLY'
          REMOTE
