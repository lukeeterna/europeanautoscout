name: ARGOS C10 TEMP Pairing Read-Only Diagnostic

on:
  push:
    branches:
      - s210/audit-master-plan
    paths:
      - .github/workflows/argos-c10-temp-pairing-diag.yml

permissions:
  contents: read

concurrency:
  group: argos-c10-pairing-readonly-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, macbook, argos]
    timeout-minutes: 5
    steps:
      - name: Probe isolated Chrome and WhatsApp Web from iMac
        shell: bash
        run: |
          set -euo pipefail
          echo 'DIAG_MUTATION=TEMP_ONLY'
          echo 'PRODUCTION_MUTATION=NONE'
          echo 'OUTBOUND_ACTION=NONE'
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            gianlucadistasi@iMac-di-gianluca.local python3 <<'PY'
          import os, pathlib, shutil, subprocess, tempfile, urllib.request
          sha='5dd932e6ab27a43b5486afbd41c18396e5d15830'
          home=pathlib.Path.home()
          chrome=home/'.cache/puppeteer/chrome/mac-148.0.7778.97/chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing'
          stable=pathlib.Path('/Applications/Google Chrome.app/Contents/MacOS/Google Chrome')
          release=home/f'Documents/argos-c10-release-{sha[:12]}'
          print('DIAG_EXPECTED_SHA='+sha)
          print('DIAG_CHROME_EXECUTABLE='+str(chrome.is_file() and os.access(chrome,os.X_OK)).upper())
          print('DIAG_RELEASE_PRESENT='+str(release.is_dir()).upper())
          print('DIAG_STABLE_CHROME='+str(stable.is_file() and os.access(stable,os.X_OK)).upper())
          for label,binary in (('CFT',chrome),('STABLE',stable)):
              if binary.is_file():
                  v=subprocess.run([str(binary),'--version'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=10).stdout.strip()
                  print('DIAG_'+label+'_VERSION='+v[:120])
          try:
              with urllib.request.urlopen('https://web.whatsapp.com/',timeout=20) as r:
                  print('DIAG_WA_WEB_HTTP='+str(r.status))
          except Exception as e:
              print('DIAG_WA_WEB_HTTP=ERROR_'+type(e).__name__)
          js=r"""
const path=require('path');
const root=process.argv[2], binary=process.argv[3], label=process.argv[4];
const puppeteer=require(path.join(root,'node_modules','puppeteer'));
(async()=>{
  const browser=await puppeteer.launch({
    headless:true, executablePath:binary,
    userDataDir:process.env.ARGOS_DIAG_PROFILE,
    args:['--no-first-run','--no-default-browser-check']
  });
  try {
    const page=await browser.newPage();
    const response=await page.goto('https://web.whatsapp.com/',{waitUntil:'domcontentloaded',timeout:30000});
    console.log('DIAG_'+label+'_PUPPETEER_LAUNCH=PASS');
    console.log('DIAG_'+label+'_PUPPETEER_HTTP='+(response ? response.status() : 'NONE'));
  } finally { await browser.close(); }
})().catch(e=>{console.log('DIAG_'+label+'_PUPPETEER_ERROR='+e.name);process.exit(20);});
"""
          results=[]
          for label,binary in (('CFT',chrome),('STABLE',stable)):
              tmp=pathlib.Path(tempfile.mkdtemp(prefix='argos-pair-diag-'))
              try:
                  env={**os.environ,'ARGOS_DIAG_PROFILE':str(tmp)}
                  try:
                      p=subprocess.run(['node','-',str(release/'wa-intelligence'),str(binary),label],
                                       input=js,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,
                                       timeout=50,check=False,env=env)
                      for line in p.stdout.splitlines():
                          if line.startswith('DIAG_'): print(line[:200])
                      print('DIAG_'+label+'_PUPPETEER_RC='+str(p.returncode))
                      results.append((label,p.returncode))
                  except subprocess.TimeoutExpired:
                      print('DIAG_'+label+'_PUPPETEER=TIMEOUT')
                      results.append((label,124))
              finally:
                  shutil.rmtree(tmp,ignore_errors=True)
          if dict(results).get('STABLE') != 0:
              raise SystemExit(20)
          if not chrome.is_file() or not release.is_dir():
              raise SystemExit(21)
          print('PAIRING_DIAGNOSTIC=PASS_READ_ONLY')
          PY
