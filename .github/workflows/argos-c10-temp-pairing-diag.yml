name: ARGOS C10 TEMP Cancel Superseded Read-Only Run

on:
  push:
    branches: [s210/audit-master-plan]
    paths: [.github/workflows/argos-c10-temp-pairing-diag.yml]

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-22.04
    steps:
      - name: Cancel superseded cutover before mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/34862500523/cancel"
          echo 'SUPERSEDED_READ_ONLY_RUN_CANCEL_REQUESTED=YES'
          echo 'PRODUCTION_MUTATION=NONE'
