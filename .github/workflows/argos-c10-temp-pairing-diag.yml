name: ARGOS C10 TEMP Recovery Read-Only Diagnostic

on:
  push:
    branches:
      - s210/audit-master-plan
    paths:
      - .github/workflows/argos-c10-temp-pairing-diag.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, macbook, argos]
    timeout-minutes: 5
    steps:
      - name: Inspect failed promotion boundary without mutation
        shell: bash
        run: |
          set -euo pipefail
          echo 'DIAG_MUTATION=NONE'
          echo 'OUTBOUND_ACTION=NONE'
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            gianlucadistasi@iMac-di-gianluca.local \
            "python3 - 'a7e98c158f0f5ea08cc8974131d9953120dcb4c3' '34855323454'" <<'PY'
          import json,sqlite3,subprocess,sys
          from pathlib import Path
          sha,run_id=sys.argv[1:]
          home=Path.home()
          pm2=home/'.npm-global/bin/pm2'
          db=home/'Documents/app-antigravity-auto/dealer_network.sqlite'
          root=home/'Documents/app-antigravity-auto/wa-sender'
          session=root/'session-argos-business'
          ready=home/'Documents/argos-c10-pairing-ready'/sha
          promo=home/'Documents/argos-c10-pairing-promotions'/f'{sha}-{run_id}'
          for name in ('argos-wa-daemon','argos-outreach-scheduler'):
              p=subprocess.run([str(pm2),'pid',name],capture_output=True,text=True,timeout=10)
              value=p.stdout.strip()
              safe=value if value.isdigit() else 'NONE'
              print(f'DIAG_PM2_PID_{name.upper().replace("-","_")}={safe}')
              print(f'DIAG_PM2_PID_RC_{name.upper().replace("-","_")}={p.returncode}')
          try:
              procs=json.loads(subprocess.run([str(pm2),'jlist'],capture_output=True,text=True,timeout=10,check=True).stdout)
              for name in ('argos-wa-daemon','argos-outreach-scheduler'):
                  rows=[p for p in procs if p.get('name')==name]
                  status=rows[0].get('pm2_env',{}).get('status','ABSENT') if rows else 'ABSENT'
                  print(f'DIAG_PM2_{name.upper().replace("-","_")}={status}')
          except Exception as e:
              print('DIAG_PM2=ERROR_'+type(e).__name__)
          writer=subprocess.run("ps -axo command= | awk '/[w]a-daemon\\.js/ && /[n]ode/ {n++} END{print n+0}'",shell=True,capture_output=True,text=True).stdout.strip()
          chrome=subprocess.run(f"ps -axo command= | grep -F '{root}' | grep -i '[c]hrome' | wc -l",shell=True,capture_output=True,text=True).stdout.strip()
          print('DIAG_WRITER_COUNT='+writer)
          print('DIAG_CANONICAL_CHROME_COUNT='+chrome)
          print('DIAG_SESSION_PRESENT='+str(session.is_dir() and any(p.is_file() for p in session.rglob('*'))).upper())
          print('DIAG_READY_PRESENT='+str(ready.is_dir()).upper())
          print('DIAG_PROMO_PRESENT='+str(promo.is_dir()).upper())
          for name in ('original-session','new-session','failed-session','restore-session'):
              print('DIAG_PROMO_'+name.upper().replace('-','_')+'='+str((promo/name).exists()).upper())
          c=sqlite3.connect(f'file:{db}?mode=ro',uri=True,timeout=5)
          q=c.execute('PRAGMA quick_check').fetchone()[0]
          row=c.execute("SELECT value FROM argos_runtime_state WHERE key='agent_status'").fetchone()
          out=c.execute("SELECT COUNT(*) FROM messages WHERE UPPER(direction)='OUTBOUND'").fetchone()[0]
          c.close()
          print('DIAG_DB_QUICK_CHECK='+q)
          print('DIAG_AGENT_STATUS='+(row[0] if row else 'ABSENT').upper())
          print('DIAG_OUTBOUND_TOTAL='+str(out))
          PY
