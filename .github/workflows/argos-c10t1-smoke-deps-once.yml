name: ARGOS C10T1 One-Shot Smoke Dependency Gate

on:
  push:
    branches:
      - sol/argos-cloudapi-c10t1-gpt56
    paths:
      - '.github/workflows/argos-c10t1-smoke-deps-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/argos-cloudapi-c10t1-gpt56
          fetch-depth: 0
      - name: Patch exact smoke anchors
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/scripts/argos_c10_smoke.py')
          text = path.read_text(encoding='utf-8')
          anchor_files = '''        intel / "ecosystem.config.js",\n        intel / "transport" / "index.js",'''
          repl_files = '''        intel / "ecosystem.config.js",\n        intel / "package.json",\n        intel / "package-lock.json",\n        intel / "transport" / "index.js",'''
          assert text.count(anchor_files) == 1, 'required-files anchor mismatch'
          text = text.replace(anchor_files, repl_files)

          anchor_deps = '''        for rel in node_files:\n            result = _run([node, "--check", rel], cwd=root)\n            report.add(f"node_check:{rel}", result.returncode == 0, result.stderr.strip() or "PASS")\n\n    report.add("env_file_present", env_file.is_file(), str(env_file))'''
          repl_deps = '''        for rel in node_files:\n            result = _run([node, "--check", rel], cwd=root)\n            report.add(f"node_check:{rel}", result.returncode == 0, result.stderr.strip() or "PASS")\n        runtime_deps = _run(\n            [\n                node,\n                "-e",\n                "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.prepare('SELECT 1').get(); db.close(); require('qrcode');",\n            ],\n            cwd=intel,\n        )\n        report.add(\n            "node_runtime_dependencies",\n            runtime_deps.returncode == 0,\n            runtime_deps.stderr.strip() or "better-sqlite3+qrcode PASS",\n        )\n\n    report.add("env_file_present", env_file.is_file(), str(env_file))'''
          assert text.count(anchor_deps) == 1, 'runtime-deps anchor mismatch'
          path.write_text(text.replace(anchor_deps, repl_deps), encoding='utf-8')
          PY
          python -m py_compile tools/scripts/argos_c10_smoke.py
          git diff --check
          grep -q 'intel / "package-lock.json"' tools/scripts/argos_c10_smoke.py
          grep -q 'node_runtime_dependencies' tools/scripts/argos_c10_smoke.py
      - name: Commit only smoke patch
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 | grep -v '^ M tools/scripts/argos_c10_smoke.py$' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/scripts/argos_c10_smoke.py
          git commit -m 'ARGOS C10T1: require installed locked Node runtime'
          git push origin HEAD:sol/argos-cloudapi-c10t1-gpt56
