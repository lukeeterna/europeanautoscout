name: ARGOS C0 Safety Apply and Verify

on:
  push:
    branches:
      - sol/argos-canonicalization-20260817

permissions:
  contents: write

jobs:
  apply-c0:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy opencv-python-headless reportlab requests python-dotenv

      - name: Verify canonical patch applies exactly
        run: |
          git status --short
          shasum -a 256 .argos-work/C0_SAFETY_FAIL_CLOSED.patch
          git apply --check --verbose .argos-work/C0_SAFETY_FAIL_CLOSED.patch

      - name: Apply C0 fail-closed patch
        run: |
          git apply .argos-work/C0_SAFETY_FAIL_CLOSED.patch
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/cove/image_sanitizer.py tools/scripts/pdf_generator_enterprise.py "

      - name: Syntax compile
        run: |
          python -m py_compile src/cove/image_sanitizer.py tools/scripts/pdf_generator_enterprise.py

      - name: Canonical C0 contract test
        run: |
          python .argos-work/test_c0_safety_contract.py

      - name: Extended fail-closed contract checks
        run: |
          python - <<'PY'
          import importlib.util
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          import numpy as np
          from PIL import Image

          root = Path.cwd()

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          san = load('argos_san_ext', root/'src/cove/image_sanitizer.py')
          pdf = load('argos_pdf_ext', root/'tools/scripts/pdf_generator_enterprise.py')

          td = tempfile.mkdtemp(prefix='argos_c0_ext_')
          raw = os.path.join(td, 'raw.jpg')
          arr = np.random.default_rng(7).integers(0, 255, (600, 900, 3), dtype=np.uint8)
          Image.fromarray(arr).save(raw, quality=95)
          assert os.path.getsize(raw) > san.MIN_IMAGE_BYTES

          # OCR detector exception => image excluded.
          orig_detect = san._detect_text_regions
          orig_hood = san._detect_hood_reflection
          san._detect_text_regions = lambda *_a, **_k: (_ for _ in ()).throw(RuntimeError('ocr boom'))
          san._detect_hood_reflection = lambda *_a, **_k: False
          assert san.sanitize_image(raw, output_dir=td, listing_id='ocrerr', image_index=0) is None
          san._detect_text_regions = orig_detect
          san._detect_hood_reflection = orig_hood

          # Post-verification backend unavailable/error => False.
          orig_get = san._get_vision_ocr
          san._get_vision_ocr = lambda: None
          assert san._post_verify_and_alert(raw, raw, 'pv-none', 0, None) is False
          san._get_vision_ocr = lambda: (_ for _ in ()).throw(RuntimeError('backend init'))
          try:
              v = san._post_verify_and_alert(raw, raw, 'pv-err', 0, None)
          except RuntimeError:
              # A backend initialization exception is also fail-closed because it cannot yield success.
              v = False
          assert v is False
          san._get_vision_ocr = orig_get

          # High-confidence sensitive residual => reject.
          def residual_vision(*_a, **_k):
              return [{'text':'AUTOHAUS SECRET','confidence':0.99,'box':[0,0,100,30],'should_mask':True}]
          san._get_vision_ocr = lambda: residual_vision
          assert san._post_verify_and_alert(raw, raw, 'residual', 0, 'AUTOHAUS SECRET') is False
          san._get_vision_ocr = orig_get

          # PDF timeout => None, never RAW.
          orig_find = pdf._find_sanitizer_python
          orig_run = subprocess.run
          pdf._find_sanitizer_python = lambda: '/usr/bin/python3'
          subprocess.run = lambda *_a, **_k: (_ for _ in ()).throw(subprocess.TimeoutExpired(cmd='san', timeout=120))
          assert pdf._sanitize_photo(raw, 0, 'timeout', td) is None
          subprocess.run = orig_run
          pdf._find_sanitizer_python = orig_find

          # Source-level guarantees.
          psrc = (root/'tools/scripts/pdf_generator_enterprise.py').read_text()
          ssrc = (root/'src/cove/image_sanitizer.py').read_text()
          forbidden_pdf = ['using original RAW','All photos failed — using originals','falling back to raw download','NO SANITIZATION','Photo NOT sanitized']
          forbidden_san = ['assume OK','ACTION: Review manually','review manually','HITL review']
          assert not [x for x in forbidden_pdf if x in psrc]
          assert not [x for x in forbidden_san if x in ssrc]
          assert 'SENTINEL_SKIP_PROMO' in ssrc and 'SENTINEL_SKIP_PROMO' in psrc
          print('PASS: extended C0 fail-closed checks')
          PY

      - name: Static RAW fallback audit
        run: |
          ! grep -nE 'using original RAW|All photos failed — using originals|falling back to raw download|NO SANITIZATION|Photo NOT sanitized|assume OK|ACTION: Review manually|review manually|HITL review' src/cove/image_sanitizer.py tools/scripts/pdf_generator_enterprise.py
          git diff --check

      - name: Commit only verified production changes
        run: |
          git config user.name "ARGOS Sol"
          git config user.email "argos-sol@users.noreply.github.com"
          git rm -r .argos-work
          git rm .github/workflows/sol-argos-c0-apply.yml
          git add src/cove/image_sanitizer.py tools/scripts/pdf_generator_enterprise.py
          git diff --cached --check
          git status --short
          git commit -m "fix(c0): fail closed sanitizer and PDF image pipeline"
          git push origin HEAD:sol/argos-canonicalization-20260817
