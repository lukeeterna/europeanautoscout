name: ARGOS C10T1 One-Shot Runtime Lockfile

on:
  push:
    branches:
      - sol/argos-cloudapi-c10t1-gpt56
    paths:
      - '.github/workflows/argos-c10t1-lockfile-once.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/argos-cloudapi-c10t1-gpt56
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate lockfile only from pinned manifest
        working-directory: wa-intelligence
        run: |
          set -euo pipefail
          test ! -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const l = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (l.lockfileVersion < 3) throw new Error('lockfileVersion must be >=3');
          const root = l.packages && l.packages[''];
          if (!root) throw new Error('lockfile root package missing');
          for (const [name, version] of Object.entries(p.dependencies || {})) {
            if (root.dependencies?.[name] !== version) throw new Error(`root lock mismatch ${name}`);
          }
          for (const [name, version] of Object.entries(p.optionalDependencies || {})) {
            if (root.optionalDependencies?.[name] !== version) throw new Error(`root optional lock mismatch ${name}`);
          }
          console.log('LOCKFILE_CONTRACT=PASS');
          NODE
          git diff --check

      - name: Commit only package-lock.json
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 | grep -v '^?? wa-intelligence/package-lock.json$' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- wa-intelligence/package-lock.json
          git commit -m 'ARGOS C10T1: lock canonical Node runtime dependencies'
          git push origin HEAD:sol/argos-cloudapi-c10t1-gpt56
