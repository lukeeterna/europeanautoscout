name: ARGOS C10 Cancel Stale Cutover

# One-shot safety workflow. Cancels the already-started automatic cutover that
# was armed before pairing was changed to manual single-shot. No machine access,
# production mutation or outbound action occurs here.
# Trigger arm: cancel run 33266820761 before another LocalAuth retry completes.
on:
  push:
    branches:
      - sol/argos-wwebjs-c10-production
    paths:
      - '.github/workflows/argos-c10-cancel-stale-cutover.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Cancel stale cutover run 33266820761
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'TARGET_RUN_ID=33266820761'
          echo 'PRODUCTION_MUTATION=NONE'
          echo 'OUTBOUND_ACTION=NONE'
          status="$(curl --silent --show-error --output /tmp/cancel.json --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/33266820761/cancel")"
          case "$status" in
            202|409) echo "CANCEL_REQUEST_HTTP=$status" ;;
            *) cat /tmp/cancel.json >&2; echo "CANCEL_REQUEST_HTTP=$status" >&2; exit 1 ;;
          esac
