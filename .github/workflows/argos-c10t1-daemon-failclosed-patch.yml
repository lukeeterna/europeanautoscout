name: ARGOS C10T1 One-Shot Daemon Fail-Closed Patch

on:
  push:
    branches:
      - sol/argos-cloudapi-c10t1-gpt56
    paths:
      - '.github/workflows/argos-c10t1-daemon-failclosed-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/argos-cloudapi-c10t1-gpt56
          fetch-depth: 0

      - name: Replace the unique direct-boot ACTIVE seed with PAUSED
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('wa-intelligence/wa-daemon.js')
          text = path.read_text(encoding='utf-8')
          old = "VALUES ('agent_status', 'ACTIVE', ?)"
          new = "VALUES ('agent_status', 'PAUSED', ?)"
          count = text.count(old)
          if count == 0 and new in text:
              print('DAEMON_SEED_ALREADY_PAUSED=YES')
          else:
              assert count == 1, f'expected exactly one ACTIVE seed, found {count}'
              path.write_text(text.replace(old, new), encoding='utf-8')
              print('DAEMON_SEED_PATCHED=YES')
          PY
          node --check wa-intelligence/wa-daemon.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('wa-intelligence/wa-daemon.js').read_text(encoding='utf-8')
          assert "VALUES ('agent_status', 'ACTIVE', ?)" not in text
          assert "VALUES ('agent_status', 'PAUSED', ?)" in text
          print('DIRECT_BOOT_FAIL_CLOSED=PASS')
          PY

      - name: Commit only the daemon patch when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- wa-intelligence/wa-daemon.js; then
            echo 'NO_COMMIT_NEEDED=YES'
            exit 0
          fi
          test -z "$(git status --porcelain=v1 | grep -v '^ M wa-intelligence/wa-daemon.js$' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- wa-intelligence/wa-daemon.js
          git commit -m 'ARGOS C10T1: make direct daemon boot PAUSED'
          git push origin HEAD:sol/argos-cloudapi-c10t1-gpt56
