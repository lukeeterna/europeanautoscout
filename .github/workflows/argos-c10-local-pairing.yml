name: ARGOS C10 Local Pairing

# Pairing is an explicit human gate. It MUST NOT run on push or retry QR
# acquisition automatically: repeated device-link attempts can leave the phone
# in a temporary "try again later" state. QR material never enters logs or
# GitHub artifacts. The self-hosted MacBook fetches exactly one current QR over
# the existing strict SSH lane and renders it only in a local temporary HTML
# file. C10 remains PAUSED with zero outbound throughout pairing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argos-c10-local-pairing
  cancel-in-progress: false

jobs:
  pair:
    name: Pair existing LocalAuth session locally
    runs-on: [self-hosted, macbook, argos]
    timeout-minutes: 8
    steps:
      - name: Verify paused zero-outbound preconditions
        shell: bash
        run: |
          set -euo pipefail
          echo 'PAIRING_CHANNEL=LOCAL_MACBOOK_ONLY'
          echo 'PAIRING_POLICY=MANUAL_SINGLE_SHOT'
          echo 'PAIRING_AUTOMATIC_RETRY=DISABLED'
          echo 'GITHUB_QR_EXPOSURE=NONE'
          echo 'OUTBOUND_ACTION=NONE'
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            gianlucadistasi@iMac-di-gianluca.local python3 <<'PY'
          import json, sqlite3, urllib.request
          from pathlib import Path
          db=Path.home()/'Documents/app-antigravity-auto/dealer_network.sqlite'
          c=sqlite3.connect(f'file:{db}?mode=ro',uri=True,timeout=5)
          try:
              state=c.execute("SELECT value FROM argos_runtime_state WHERE key='agent_status'").fetchone()[0]
              outbound=c.execute("SELECT COUNT(*) FROM messages WHERE UPPER(direction)='OUTBOUND'").fetchone()[0]
          finally: c.close()
          with urllib.request.urlopen('http://127.0.0.1:9191/health',timeout=3) as r:
              h=json.load(r)
          print(f'PAIR_PRE_AGENT_STATUS={state}')
          print(f'PAIR_PRE_OUTBOUND_TOTAL={outbound}')
          print(f'PAIR_PRE_CONNECTED={h.get("connected")}')
          if str(state).upper()!='PAUSED' or int(outbound)!=77:
              raise SystemExit(20)
          PY

      - name: Render one QR only on MacBook screen
        shell: bash
        run: |
          set -euo pipefail
          html="/tmp/argos-c10-pairing-${GITHUB_RUN_ID}.html"
          rm -f "$html"
          cleanup() { rm -f "$html"; }
          trap cleanup EXIT

          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            gianlucadistasi@iMac-di-gianluca.local \
            'curl --fail --silent --max-time 3 http://127.0.0.1:9191/qr' \
            | HTML_PATH="$html" python3 -c 'import json,os,sys,html; d=json.load(sys.stdin); q=d.get("qr_data_url"); assert isinstance(q,str) and q.startswith("data:image/"); p=os.environ["HTML_PATH"]; open(p,"w",encoding="utf-8").write("<!doctype html><meta charset=utf-8><title>ARGOS C10 Pairing</title><style>body{font-family:-apple-system,sans-serif;text-align:center;padding:30px}img{width:min(70vw,560px);height:auto}p{font-size:20px}</style><h1>ARGOS C10 — WhatsApp pairing</h1><p>Single-shot: WhatsApp → Dispositivi collegati → Collega un dispositivo</p><img alt=QR src=\""+html.escape(q,quote=True)+"\">")'
          test -s "$html"
          /usr/bin/open "$html"
          echo 'PAIRING_QR_FETCH_COUNT=1'
          echo 'PAIRING_QR_OPENED_LOCALLY=YES'

          # Passive health observation only. This loop never requests a new QR,
          # creates a new pairing challenge, resumes ARGOS or sends a message.
          connected=0
          for _ in $(seq 1 72); do
            verdict="$(ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
              gianlucadistasi@iMac-di-gianluca.local python3 <<'PY'
          import json,urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:9191/health',timeout=3) as r: h=json.load(r)
              print('YES' if h.get('connected') is True and str(h.get('agent_status')).upper()=='PAUSED' else 'NO')
          except Exception: print('NO')
          PY
            )"
            if [ "$verdict" = YES ]; then connected=1; break; fi
            sleep 5
          done
          test "$connected" -eq 1
          echo 'PAIRING_CONNECTED=YES'

      - name: Verify pairing did not send anything
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            gianlucadistasi@iMac-di-gianluca.local python3 <<'PY'
          import json, sqlite3, urllib.request
          from pathlib import Path
          db=Path.home()/'Documents/app-antigravity-auto/dealer_network.sqlite'
          c=sqlite3.connect(f'file:{db}?mode=ro',uri=True,timeout=5)
          try:
              state=c.execute("SELECT value FROM argos_runtime_state WHERE key='agent_status'").fetchone()[0]
              outbound=c.execute("SELECT COUNT(*) FROM messages WHERE UPPER(direction)='OUTBOUND'").fetchone()[0]
          finally: c.close()
          with urllib.request.urlopen('http://127.0.0.1:9191/health',timeout=3) as r: h=json.load(r)
          print(f'PAIR_POST_CONNECTED={h.get("connected")}')
          print(f'PAIR_POST_AGENT_STATUS={state}')
          print(f'PAIR_POST_OUTBOUND_TOTAL={outbound}')
          if h.get('connected') is not True or str(state).upper()!='PAUSED' or int(outbound)!=77:
              raise SystemExit(21)
          print('PAIRING_GATE=GREEN')
          PY
