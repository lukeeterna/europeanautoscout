name: ARGOS Pre-Pairing Production Contract

on:
  push:
    branches:
      - sol/argos-wwebjs-c10-production
    paths:
      - '.github/workflows/argos-c10-*.yml'
      - '.github/workflows/argos-c10t1-imac-preflight.yml'
      - '.github/workflows/argos-prepairing-contract.yml'
      - 'tests/test_argos_cutover_recovery.py'
      - 'tests/test_argos_pairing_workflow.py'
      - 'tests/test_argos_c10_pairing_helper.cjs'
      - 'wa-intelligence/tools/argos_c10_pairing_helper.js'
      - 'tests/test_argos_pre_pairing_readiness.py'
      - 'tests/test_argos_c11_preflight.py'
      - 'tools/scripts/argos_c11_preflight.py'
      - 'wa-intelligence/outbound_guard.py'
      - 'wa-intelligence/whatsapp_consent.py'
      - 'wa-intelligence/state_machine.py'
      - 'wa-intelligence/wa-daemon.js'
      - 'wa-intelligence/.env.example'
      - 'wa-intelligence/tools/argos_c10_wwebjs_cutover.sh'
  pull_request:
    paths:
      - '.github/workflows/argos-c10-*.yml'
      - '.github/workflows/argos-c10t1-imac-preflight.yml'
      - '.github/workflows/argos-prepairing-contract.yml'
      - 'tests/test_argos_cutover_recovery.py'
      - 'tests/test_argos_pairing_workflow.py'
      - 'tests/test_argos_c10_pairing_helper.cjs'
      - 'wa-intelligence/tools/argos_c10_pairing_helper.js'
      - 'tests/test_argos_pre_pairing_readiness.py'
      - 'tests/test_argos_c11_preflight.py'
      - 'tools/scripts/argos_c11_preflight.py'
      - 'wa-intelligence/outbound_guard.py'
      - 'wa-intelligence/whatsapp_consent.py'
      - 'wa-intelligence/state_machine.py'
      - 'wa-intelligence/wa-daemon.js'
      - 'wa-intelligence/.env.example'
      - 'wa-intelligence/tools/argos_c10_wwebjs_cutover.sh'

permissions:
  contents: read

jobs:
  prepairing:
    name: Offline pre-pairing safety and recovery contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Native exact-SHA checkout
        env:
          ARGOS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${GITHUB_WORKSPACE:-}" = "$PWD"
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$ARGOS_SOURCE_SHA"
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$ARGOS_SOURCE_SHA"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Run isolated pairing lifecycle tests
        run: node --test tests/test_argos_c10_pairing_helper.cjs

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Compile final outbound and C11 boundaries
        run: |
          python -m py_compile \
            wa-intelligence/outbound_guard.py \
            wa-intelligence/whatsapp_consent.py \
            wa-intelligence/state_machine.py \
            tools/scripts/argos_c11_preflight.py \
            tests/test_argos_pre_pairing_readiness.py \
            tests/test_argos_c11_preflight.py

      - name: Run pre-pairing production regressions
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v \
            tests.test_argos_cutover_recovery \
            tests.test_argos_pairing_workflow \
            tests.test_argos_pre_pairing_readiness \
            tests.test_argos_c11_preflight

      - name: Assert pairing remains the only deferred external gate
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          pairing = (root / '.github/workflows/argos-c10-local-pairing.yml').read_text(encoding='utf-8')
          cutover = (root / '.github/workflows/argos-c10-wwebjs-cutover.yml').read_text(encoding='utf-8')
          alt = (root / '.github/workflows/argos-c10-alt-localauth-probe.yml').read_text(encoding='utf-8')
          auth_diag = (root / '.github/workflows/argos-c10-auth-lifecycle-diagnostic.yml').read_text(encoding='utf-8')
          guard = (root / 'wa-intelligence/outbound_guard.py').read_text(encoding='utf-8')
          c11 = (root / 'tools/scripts/argos_c11_preflight.py').read_text(encoding='utf-8')

          for name, text in {
              'pairing': pairing,
              'cutover': cutover,
              'alternate LocalAuth probe': alt,
              'LocalAuth lifecycle diagnostic': auth_diag,
          }.items():
              on_block = text.split('\npermissions:', 1)[0]
              assert 'workflow_dispatch:' in on_block, f'{name} lost manual dispatch'
              assert '\n  push:' not in on_block, f'{name} became push-triggered'
              assert 'pull_request:' not in on_block, f'{name} became PR-triggered'

          assert 'OUTREACH_NOT_AUTHORIZED' in guard
          assert 'WHATSAPP_OPT_IN_REQUIRED' in guard
          assert '/resume' in c11 and '/send' in c11  # documented forbidden side effects
          assert 'urllib.request.urlopen' in c11      # GET /health only
          assert 'expected_outbound_baseline' in c11
          print('PREPAIRING_EXTERNAL_GATE=WHATSAPP_DEVICE_LINK_PAIRING')
          print('AUTOMATIC_PAIRING=DISABLED')
          print('AUTOMATIC_CUTOVER=DISABLED')
          print('FINAL_SEND_AUTHORIZATION_CONSENT=ENFORCED')
          print('C11_PREFLIGHT=OFFLINE_CERTIFIED_CONTRACT')
          PY
