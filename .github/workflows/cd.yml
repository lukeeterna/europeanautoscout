name: CD — RETIRED legacy iMac deploy

# S292/C10T1 production safety:
# The historical master-push deploy and scheduled Day7 runner are retired.
# They targeted the pre-canonical runtime and could reintroduce a second/legacy
# execution path when iMac SSH credentials are restored.
#
# Canonical deployment is governed by docs/runbooks/ARGOS_C10T1_CLOUD_CUTOVER.md
# and must remain exact-SHA, PAUSED, automation=0 until the machine gates pass.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-22.04
    steps:
      - name: Refuse historical deployment path
        run: |
          echo 'LEGACY_CD_RETIRED=YES'
          echo 'PRODUCTION_MUTATED=NO'
          echo 'Use the canonical ARGOS C10T1 exact-SHA cutover workflow/runbook.'
          exit 1
