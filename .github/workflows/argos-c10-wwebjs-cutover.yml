name: ARGOS C10 WhatsApp Web Cutover

# Production cutover is an explicit manual gate. It MUST NOT run because a C10T1
# comment, diagnostic or source commit changed. This matters especially while
# WhatsApp device linking is temporarily rejecting pairing attempts. A manual
# dispatch still requires S292 GREEN on the exact same SHA before the rollback-
# safe machine script is allowed to mutate PM2.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: argos-c10-wwebjs-cutover
  cancel-in-progress: false

jobs:
  cutover:
    name: Exact-SHA rollback-safe wwebjs cutover
    runs-on: [self-hosted, macbook, argos]
    timeout-minutes: 25

    steps:
      - name: Native exact-SHA checkout
        shell: bash
        run: |
          set -euo pipefail
          command -v git >/dev/null
          test -n "${GITHUB_WORKSPACE:-}"
          test -n "${RUNNER_WORKSPACE:-}"
          case "$GITHUB_WORKSPACE" in
            "$RUNNER_WORKSPACE"/*) ;;
            *) echo "BLOCKED: unexpected GITHUB_WORKSPACE=$GITHUB_WORKSPACE" >&2; exit 70 ;;
          esac
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "NATIVE_CHECKOUT_SHA=$GITHUB_SHA"

      - name: Verify cutover tooling is shell-safe
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test -f wa-intelligence/tools/argos_c10_wwebjs_cutover.sh
          test -f tools/scripts/argos_c10_machine_probe.sh
          bash -n wa-intelligence/tools/argos_c10_wwebjs_cutover.sh
          bash -n tools/scripts/argos_c10_machine_probe.sh
          echo 'CUTOVER_TOOLING_SYNTAX=PASS'
          echo 'TARGET_RUNTIME_STATUS=PAUSED'
          echo 'TARGET_AUTOMATION_ENABLED=0'
          echo 'OUTBOUND_ACTION=NONE'

      - name: Require S292 GREEN on this exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GH_TOKEN" <<'PY'
          import json, sys, time, urllib.request
          repo, sha, token = sys.argv[1:]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/argos-s292-contract.yml/runs?head_sha={sha}&per_page=20"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          deadline = time.time() + 12 * 60
          while time.time() < deadline:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=15) as r:
                  payload = json.load(r)
              push_runs = [x for x in payload.get("workflow_runs", []) if x.get("event") == "push" and x.get("head_sha") == sha]
              completed = [x for x in push_runs if x.get("status") == "completed"]
              if any(x.get("conclusion") == "success" for x in completed):
                  if any(x.get("conclusion") not in ("success", None) for x in completed):
                      print("S292_EXACT_SHA=RED")
                      raise SystemExit(20)
                  run = next(x for x in completed if x.get("conclusion") == "success")
                  print(f"S292_EXACT_SHA=GREEN")
                  print(f"S292_RUN_ID={run.get('id')}")
                  raise SystemExit(0)
              if completed and all(x.get("conclusion") not in (None, "success") for x in completed):
                  print("S292_EXACT_SHA=RED")
                  raise SystemExit(20)
              time.sleep(10)
          print("S292_EXACT_SHA=TIMEOUT")
          raise SystemExit(21)
          PY

      - name: Stage exact-SHA release with proxy bypass
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            gianlucadistasi@iMac-di-gianluca.local \
            "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          SHA="$1"
          SHORT="${SHA:0:12}"
          RELEASE="$HOME/Documents/argos-c10-release-$SHORT"
          TMP="${RELEASE}.stage.$$"
          cleanup() { rm -rf "$TMP"; }
          trap cleanup EXIT

          if [[ -e "$RELEASE" ]]; then
            if [[ -d "$RELEASE/.git" ]] && [[ "$(git -C "$RELEASE" rev-parse HEAD 2>/dev/null || true)" == "$SHA" ]]; then
              echo "RELEASE_STAGE=EXACT_ALREADY"
              exit 0
            fi
            echo "RELEASE_STAGE=BLOCKED_EXISTING_MISMATCH" >&2
            exit 20
          fi

          mkdir -p "$TMP"
          git init -q "$TMP"
          git -C "$TMP" remote add origin https://github.com/lukeeterna/europeanautoscout.git
          HTTP_PROXY= HTTPS_PROXY= ALL_PROXY= http_proxy= https_proxy= all_proxy= \
            git -C "$TMP" \
              -c http.proxy= \
              -c https.proxy= \
              -c protocol.version=2 \
              fetch --no-tags --depth=1 origin "$SHA"
          git -C "$TMP" checkout --detach --force FETCH_HEAD
          test "$(git -C "$TMP" rev-parse HEAD)" = "$SHA"
          mv "$TMP" "$RELEASE"
          trap - EXIT
          echo "RELEASE_STAGE=PASS"
          echo "RELEASE_STAGE_SHA=$SHA"
          echo "PRODUCTION_PROCESS_MUTATION=NONE"
          echo "OUTBOUND_ACTION=NONE"
          REMOTE

      - name: Execute rollback-safe zero-outbound cutover
        id: cutover
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/argos-c10-cutover.txt
          bash wa-intelligence/tools/argos_c10_wwebjs_cutover.sh "$GITHUB_SHA" \
            2>&1 | tee /tmp/argos-c10-cutover.txt
          exit "${PIPESTATUS[0]}"

      - name: Certify machine after cutover
        id: machine
        if: ${{ success() }}
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/argos-c10-postcutover-machine.txt
          bash tools/scripts/argos_c10_machine_probe.sh "$GITHUB_SHA" \
            2>&1 | tee /tmp/argos-c10-postcutover-machine.txt
          rc="${PIPESTATUS[0]}"
          test "$rc" -eq 0
          grep -qx 'C10_MACHINE=GREEN' /tmp/argos-c10-postcutover-machine.txt
          grep -qx 'BLOCKERS=NONE' /tmp/argos-c10-postcutover-machine.txt

      - name: Publish safe cutover evidence to PR 4
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CUTOVER_OUTCOME: ${{ steps.cutover.outcome }}
          MACHINE_OUTCOME: ${{ steps.machine.outcome }}
        run: |
          set -euo pipefail
          cut=/tmp/argos-c10-cutover.txt
          machine=/tmp/argos-c10-postcutover-machine.txt
          touch "$cut" "$machine"
          safe_cut="$(grep -E '^(CUTOVER|CUTOVER_BLOCKED|EXPECTED_SHA|PRE_WRITER_COUNT|PRE_DEPLOYED_SHA|PRE_AGENT_STATUS|PRE_OUTBOUND_TOTAL|WWEBJS_VERSION|WWEBJS_LOAD|DB_BACKUP|PREDEPLOY|LOCALAUTH_BROWSER_SHUTDOWN|WWEBJS_CONNECTED|POST_OUTBOUND_TOTAL|POST_OUTBOUND_DELTA|POST_AGENT_STATUS|POST_SINGLE_WRITER|POST_PORT_9191_SINGLE_LISTENER|PM2_SAVE|EXACT_SHA|TRANSPORT|RUNTIME_STATUS|ARGOS_AUTOMATION_ENABLED|OUTBOUND_TOTAL|OUTBOUND_DELTA|ROLLBACK|ROLLBACK_OUTBOUND_TOTAL|ROLLBACK_AGENT_STATUS)=' "$cut" | tail -n 100 || true)"
          safe_machine="$(grep -E '^(WRITER_ONLINE_COUNT|WRITER_TRANSPORT|WRITER_AUTOMATION_ENABLED|DEPLOYED_SHA|PORT_9191_SINGLE_LISTENER|HEALTH_(TRANSPORT|CONNECTED|AGENT_STATUS|BRIDGE_ENABLED|PENDING_BRIDGE|GLOBAL_OUTBOUND_24H)|PRIMARY_DB_QUICK_CHECK|DB_AGENT_STATUS|OUTBOUND_TOTAL|BRIDGE_DB_QUICK_CHECK|BRIDGE_PENDING_APPROVED|C10_MACHINE|BLOCKERS)=' "$machine" | tail -n 80 || true)"
          python3 - "$GITHUB_SHA" "$CUTOVER_OUTCOME" "$MACHINE_OUTCOME" "$safe_cut" "$safe_machine" <<'PY' >/tmp/argos-cutover-comment.json
          import json,sys
          sha, cut, machine, a, b = sys.argv[1:]
          body=(
            f"C10_WWEBJS_CUTOVER={cut.upper()}\nHEAD={sha}\n"
            f"POSTCUTOVER_MACHINE={machine.upper()}\nOUTBOUND_ACTION=NONE\n\n"
            "```text\n" + (a or "NO_CUTOVER_EVIDENCE") + "\n" + (b or "NO_MACHINE_EVIDENCE") + "\n```"
          )
          print(json.dumps({"body":body}))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/4/comments" \
            --data-binary @/tmp/argos-cutover-comment.json >/dev/null

      - name: Dispatch canonical C10T1 proof after GREEN cutover
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_sha="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/sol/argos-wwebjs-c10-production | awk '{print $1}')"
          test "$branch_sha" = "$GITHUB_SHA"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/argos-c10t1-imac-preflight.yml/dispatches" \
            -d '{"ref":"sol/argos-wwebjs-c10-production"}'
          echo "CANONICAL_C10T1_DISPATCHED_SHA=$GITHUB_SHA"
