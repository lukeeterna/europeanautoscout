name: ARGOS C10 TEMP Candidate Dependency Bootstrap

on:
  push:
    branches:
      - s210/audit-master-plan
    paths:
      - .github/workflows/argos-c10-temp-deps-bootstrap.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: argos-c10-dependency-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, macbook, argos]
    timeout-minutes: 15
    env:
      ARGOS_CANDIDATE_SHA: 7151e41a13a159b9ce689310fd7e936ca237323c
    steps:
      - name: Prepare private candidate runtime without process mutation
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o ServerAliveInterval=5 -o ServerAliveCountMax=2 gianlucadistasi@iMac-di-gianluca.local "bash -s -- '$ARGOS_CANDIDATE_SHA'" <<'REMOTE'
          set -euo pipefail
          SHA="$1"
          export PATH="$HOME/.npm-global/bin:/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin:${PATH:-}"
          PM2="$HOME/.npm-global/bin/pm2"
          RELEASE="$HOME/Documents/argos-c10-release-${SHA:0:12}"
          INTEL="$RELEASE/wa-intelligence"
          command -v node >/dev/null
          command -v npm >/dev/null
          test -x "$PM2"
          test "$(git -C "$RELEASE" rev-parse HEAD)" = "$SHA"
          test -f "$INTEL/package.json"
          test -f "$INTEL/package-lock.json"

          pm2_snapshot="$(mktemp /tmp/argos-pm2-private.XXXXXX)"
          chmod 600 "$pm2_snapshot"
          trap 'rm -f "$pm2_snapshot"' EXIT
          "$PM2" jlist > "$pm2_snapshot"
          python3 - "$pm2_snapshot" <<'PY'
          import json,os,pathlib,sys,tempfile
          snapshot=pathlib.Path(sys.argv[1])
          apps=[x for x in json.loads(snapshot.read_text()) if x.get("name")=="argos-wa-daemon"]
          if len(apps)!=1:
              raise SystemExit("ARGOS_DAEMON_PM2_CARDINALITY_BLOCKED")
          env=apps[0].get("pm2_env",{})
          if env.get("status")!="online" or not apps[0].get("pid"):
              raise SystemExit("ARGOS_DAEMON_PM2_NOT_ONLINE")
          cwd=pathlib.Path(env.get("pm_cwd",""))
          target=cwd/".env"
          if not target.is_file():
              raise SystemExit("ARGOS_DAEMON_PRIVATE_ENV_MISSING")
          secret=env.get("ARGOS_API_KEY") or env.get("WA_API_KEY")
          if not secret:
              raise SystemExit("ARGOS_API_KEY_SOURCE_MISSING")
          lines=target.read_text().splitlines()
          out=[]; done=False
          for line in lines:
              key=line.split("=",1)[0].strip() if "=" in line and not line.lstrip().startswith("#") else ""
              if key=="ARGOS_API_KEY":
                  out.append("ARGOS_API_KEY="+secret); done=True
              else:
                  out.append(line)
          if not done:
              out.append("ARGOS_API_KEY="+secret)
          fd,tmp=tempfile.mkstemp(prefix=".env.argos.",dir=target.parent)
          try:
              with os.fdopen(fd,"w") as h:
                  h.write("\n".join(out)+"\n")
                  h.flush(); os.fsync(h.fileno())
              os.chmod(tmp,0o600)
              os.replace(tmp,target)
          finally:
              if os.path.exists(tmp): os.unlink(tmp)
          print("PRIVATE_DAEMON_CREDENTIAL_MATERIALIZED=PASS")
          PY
          rm -f "$pm2_snapshot"
          trap - EXIT

          npm ci --prefix "$INTEL" --include=optional --no-audit --no-fund
          npm --prefix "$INTEL" run verify:runtime-deps
          node - "$INTEL" <<'NODE'
          const path=require('path');
          const root=process.argv[2];
          require(path.join(root,'node_modules/whatsapp-web.js'));
          console.log('WWEBJS_LOAD=PASS');
          NODE
          test -z "$(git -C "$RELEASE" status --short --untracked-files=no)"
          echo 'CANDIDATE_RUNTIME_DEPS=PASS'
          echo 'PRODUCTION_PROCESS_MUTATION=NONE'
          echo 'OUTBOUND_ACTION=NONE'
          REMOTE

      - name: Dispatch fresh rollback-safe cutover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/argos-c10-temp-cutover-dispatch.yml/dispatches" -d '{"ref":"s210/audit-master-plan"}'
          echo 'CUTOVER_FRESH_DISPATCH=PASS'
