name: ARGOS C10 TEMP Candidate Dependency Bootstrap

on:
  push:
    branches:
      - s210/audit-master-plan
    paths:
      - .github/workflows/argos-c10-temp-deps-bootstrap.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: argos-c10-dependency-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, macbook, argos]
    timeout-minutes: 15
    env:
      ARGOS_CANDIDATE_SHA: 7151e41a13a159b9ce689310fd7e936ca237323c
      ARGOS_CUTOVER_RUN_ID: "34888824383"
    steps:
      - name: Install exact lockfile dependencies without process mutation
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes             -o ServerAliveInterval=5 -o ServerAliveCountMax=2             gianlucadistasi@iMac-di-gianluca.local             "bash -s -- '$ARGOS_CANDIDATE_SHA'" <<'REMOTE'
          set -euo pipefail
          SHA="$1"
          RELEASE="$HOME/Documents/argos-c10-release-${SHA:0:12}"
          INTEL="$RELEASE/wa-intelligence"
          test "$(git -C "$RELEASE" rev-parse HEAD)" = "$SHA"
          test -f "$INTEL/package.json"
          test -f "$INTEL/package-lock.json"
          cd "$INTEL"
          npm ci --omit=dev --no-audit --no-fund
          npm run verify:runtime-deps
          node -e "require('whatsapp-web.js'); console.log('WWEBJS_LOAD=PASS')"
          test -z "$(git -C "$RELEASE" status --short --untracked-files=no)"
          echo 'CANDIDATE_RUNTIME_DEPS=PASS'
          echo 'PRODUCTION_PROCESS_MUTATION=NONE'
          echo 'OUTBOUND_ACTION=NONE'
          REMOTE

      - name: Rerun rollback-safe cutover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${ARGOS_CUTOVER_RUN_ID}/rerun"
          echo "CUTOVER_RERUN_DISPATCHED=${ARGOS_CUTOVER_RUN_ID}"
