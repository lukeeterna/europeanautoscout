<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c12"/>
      <stop offset="100%" stop-color="#06060a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a446"/>
      <stop offset="100%" stop-color="#e8c870"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- Top accent -->
  <rect x="0" y="0" width="800" height="3" fill="url(#gold)" opacity="0.6"/>
  <!-- Tag -->
  <g transform="translate(60, 70)">
    <rect x="0" y="-12" width="140" height="24" rx="2" fill="rgba(200,164,70,0.1)" stroke="rgba(200,164,70,0.25)" stroke-width="0.5"/>
    <text x="70" y="4" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#c8a446" letter-spacing="2.5">APPENA TROVATA</text>
  </g>
  <!-- Car illustration (abstract BMW X3 silhouette) -->
  <g transform="translate(400, 350)" opacity="0.85">
    <!-- Car body -->
    <rect x="-220" y="-50" width="440" height="120" rx="16" fill="#1a1a24" stroke="rgba(200,164,70,0.15)" stroke-width="1"/>
    <!-- Roof -->
    <rect x="-170" y="-100" width="340" height="60" rx="12" fill="#1a1a24" stroke="rgba(200,164,70,0.15)" stroke-width="1"/>
    <!-- Windows -->
    <rect x="-155" y="-90" width="145" height="42" rx="6" fill="rgba(200,164,70,0.06)"/>
    <rect x="5" y="-90" width="145" height="42" rx="6" fill="rgba(200,164,70,0.06)"/>
    <!-- Headlights -->
    <rect x="-220" y="-20" width="35" height="12" rx="3" fill="#c8a446" opacity="0.4"/>
    <rect x="185" y="-20" width="35" height="12" rx="3" fill="#c8a446" opacity="0.4"/>
    <!-- Wheels -->
    <circle cx="-140" cy="80" r="32" fill="#222230" stroke="rgba(200,164,70,0.2)" stroke-width="1.5"/>
    <circle cx="-140" cy="80" r="18" fill="#1a1a24" stroke="rgba(200,164,70,0.1)" stroke-width="1"/>
    <circle cx="140" cy="80" r="32" fill="#222230" stroke="rgba(200,164,70,0.2)" stroke-width="1.5"/>
    <circle cx="140" cy="80" r="18" fill="#1a1a24" stroke="rgba(200,164,70,0.1)" stroke-width="1"/>
    <!-- BMW badge hint -->
    <circle cx="0" y="-74" r="10" fill="none" stroke="#c8a446" stroke-width="0.8" opacity="0.3"/>
  </g>
  <!-- Model text -->
  <text x="400" y="510" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="38" font-weight="300" fill="#e8e8f0">BMW X3 xDrive20d</text>
  <text x="400" y="548" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#68687a" letter-spacing="3">2022 · 50.000 KM · GERMANIA</text>
  <!-- Price comparison -->
  <g transform="translate(400, 620)">
    <rect x="-180" y="-30" width="360" height="80" rx="4" fill="rgba(200,164,70,0.05)" stroke="rgba(200,164,70,0.15)" stroke-width="0.5"/>
    <text x="-100" y="-2" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#68687a" letter-spacing="2">PREZZO GERMANIA</text>
    <text x="-100" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#c8a446">€34.100</text>
    <!-- Arrow -->
    <text x="0" y="18" text-anchor="middle" font-size="20" fill="#68687a">→</text>
    <text x="100" y="-2" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#68687a" letter-spacing="2">IN ITALIA DA</text>
    <text x="100" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#e8e8f0">€42.000</text>
  </g>
  <!-- Footer -->
  <line x1="60" y1="740" x2="740" y2="740" stroke="rgba(200,164,70,0.15)" stroke-width="0.5"/>
  <text x="400" y="770" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#a0a0b4" letter-spacing="2">Luca Ferretti · Vehicle Sourcing</text>
</svg>