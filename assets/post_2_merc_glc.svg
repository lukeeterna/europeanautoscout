<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c12"/>
      <stop offset="100%" stop-color="#06060a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a446"/>
      <stop offset="100%" stop-color="#e8c870"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="3" fill="url(#gold)" opacity="0.6"/>
  <!-- Tag -->
  <g transform="translate(60, 70)">
    <rect x="0" y="-12" width="180" height="24" rx="2" fill="rgba(200,164,70,0.1)" stroke="rgba(200,164,70,0.25)" stroke-width="0.5"/>
    <text x="90" y="4" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#c8a446" letter-spacing="2.5">OPPORTUNITA' DELLA SETTIMANA</text>
  </g>
  <!-- Mercedes star hint -->
  <g transform="translate(400, 280)" opacity="0.08">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#c8a446" stroke-width="2"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#c8a446" stroke-width="2"/>
    <line x1="-52" y1="30" x2="52" y2="-30" stroke="#c8a446" stroke-width="2"/>
    <line x1="-52" y1="-30" x2="52" y2="30" stroke="#c8a446" stroke-width="2"/>
  </g>
  <!-- Car abstract -->
  <g transform="translate(400, 340)" opacity="0.8">
    <rect x="-200" y="-45" width="400" height="110" rx="14" fill="#1a1a24" stroke="rgba(200,164,70,0.15)" stroke-width="1"/>
    <rect x="-155" y="-92" width="310" height="56" rx="10" fill="#1a1a24" stroke="rgba(200,164,70,0.15)" stroke-width="1"/>
    <rect x="-140" y="-82" width="130" height="38" rx="5" fill="rgba(200,164,70,0.06)"/>
    <rect x="10" y="-82" width="130" height="38" rx="5" fill="rgba(200,164,70,0.06)"/>
    <circle cx="-125" cy="75" r="30" fill="#222230" stroke="rgba(200,164,70,0.2)" stroke-width="1.5"/>
    <circle cx="-125" cy="75" r="16" fill="#1a1a24"/>
    <circle cx="125" cy="75" r="30" fill="#222230" stroke="rgba(200,164,70,0.2)" stroke-width="1.5"/>
    <circle cx="125" cy="75" r="16" fill="#1a1a24"/>
  </g>
  <!-- Model -->
  <text x="400" y="500" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="36" font-weight="300" fill="#e8e8f0">Mercedes GLC 300d</text>
  <text x="400" y="536" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#68687a" letter-spacing="3">2021 · 42.000 KM · BELGIO</text>
  <!-- Delta highlight -->
  <g transform="translate(400, 620)">
    <rect x="-160" y="-35" width="320" height="85" rx="4" fill="rgba(200,164,70,0.05)" stroke="rgba(200,164,70,0.15)" stroke-width="0.5"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#68687a" letter-spacing="2">DELTA PREZZO BE → IT</text>
    <text x="0" y="32" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#c8a446">-€7.200</text>
  </g>
  <!-- Footer -->
  <line x1="60" y1="740" x2="740" y2="740" stroke="rgba(200,164,70,0.15)" stroke-width="0.5"/>
  <text x="400" y="770" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#a0a0b4" letter-spacing="2">Luca Ferretti · Vehicle Sourcing</text>
</svg>