<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a446"/>
      <stop offset="100%" stop-color="#e8c870"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="200" cy="148" r="62"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect x="1" y="1" width="398" height="398" fill="none" stroke="rgba(200,164,70,0.15)" stroke-width="1"/>
  <!-- Avatar circle with silhouette -->
  <circle cx="200" cy="148" r="63" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
  <circle cx="200" cy="128" r="28" fill="rgba(200,164,70,0.12)"/>
  <ellipse cx="200" cy="185" rx="40" ry="28" fill="rgba(200,164,70,0.12)"/>
  <!-- Initials -->
  <text x="200" y="158" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="52" font-weight="300" fill="url(#gold)" letter-spacing="4">LF</text>
  <!-- Divider -->
  <line x1="160" y1="230" x2="240" y2="230" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>
  <!-- Name -->
  <text x="200" y="262" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="22" font-weight="400" fill="#e8e8f0" letter-spacing="3">LUCA FERRETTI</text>
  <!-- Role -->
  <text x="200" y="288" text-anchor="middle" font-family="'Courier New',monospace" font-size="8.5" fill="#c8a446" letter-spacing="3.5" text-transform="uppercase">VEHICLE SOURCING SPECIALIST</text>
  <!-- Sub -->
  <text x="200" y="310" text-anchor="middle" font-family="'Courier New',monospace" font-size="7.5" fill="#68687a" letter-spacing="2.5">MERCATI EU · BMW · MERCEDES · AUDI · PORSCHE</text>
  <!-- Bottom accent -->
  <rect x="180" y="340" width="40" height="1" fill="url(#gold)" opacity="0.3"/>
  <!-- Corner accents -->
  <path d="M12,12 L32,12 M12,12 L12,32" stroke="url(#gold)" stroke-width="0.5" opacity="0.25" fill="none"/>
  <path d="M388,12 L368,12 M388,12 L388,32" stroke="url(#gold)" stroke-width="0.5" opacity="0.25" fill="none"/>
  <path d="M12,388 L32,388 M12,388 L12,368" stroke="url(#gold)" stroke-width="0.5" opacity="0.25" fill="none"/>
  <path d="M388,388 L368,388 M388,388 L388,368" stroke="url(#gold)" stroke-width="0.5" opacity="0.25" fill="none"/>
</svg>