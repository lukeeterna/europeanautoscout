<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c12"/>
      <stop offset="100%" stop-color="#06060a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a446"/>
      <stop offset="100%" stop-color="#e8c870"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="3" fill="url(#gold)" opacity="0.6"/>
  <!-- Tag -->
  <g transform="translate(60, 70)">
    <rect x="0" y="-12" width="160" height="24" rx="2" fill="rgba(200,164,70,0.1)" stroke="rgba(200,164,70,0.25)" stroke-width="0.5"/>
    <text x="80" y="4" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#c8a446" letter-spacing="2.5">DISPONIBILE SUBITO</text>
  </g>
  <!-- Audi rings hint -->
  <g transform="translate(400, 240)" opacity="0.06">
    <circle cx="-55" cy="0" r="32" fill="none" stroke="#c8a446" stroke-width="2.5"/>
    <circle cx="-18" cy="0" r="32" fill="none" stroke="#c8a446" stroke-width="2.5"/>
    <circle cx="18" cy="0" r="32" fill="none" stroke="#c8a446" stroke-width="2.5"/>
    <circle cx="55" cy="0" r="32" fill="none" stroke="#c8a446" stroke-width="2.5"/>
  </g>
  <!-- Car abstract -->
  <g transform="translate(400, 350)" opacity="0.8">
    <rect x="-210" y="-48" width="420" height="115" rx="15" fill="#1a1a24" stroke="rgba(200,164,70,0.15)" stroke-width="1"/>
    <rect x="-165" y="-96" width="330" height="58" rx="10" fill="#1a1a24" stroke="rgba(200,164,70,0.15)" stroke-width="1"/>
    <rect x="-150" y="-86" width="140" height="40" rx="5" fill="rgba(200,164,70,0.06)"/>
    <rect x="8" y="-86" width="140" height="40" rx="5" fill="rgba(200,164,70,0.06)"/>
    <circle cx="-132" cy="78" r="31" fill="#222230" stroke="rgba(200,164,70,0.2)" stroke-width="1.5"/>
    <circle cx="-132" cy="78" r="17" fill="#1a1a24"/>
    <circle cx="132" cy="78" r="31" fill="#222230" stroke="rgba(200,164,70,0.2)" stroke-width="1.5"/>
    <circle cx="132" cy="78" r="17" fill="#1a1a24"/>
  </g>
  <!-- Model -->
  <text x="400" y="510" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="36" font-weight="300" fill="#e8e8f0">Audi Q5 40 TDI</text>
  <text x="400" y="546" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#68687a" letter-spacing="3">2022 · 38.000 KM · OLANDA</text>
  <!-- Key features -->
  <g transform="translate(400, 620)">
    <g transform="translate(-120, 0)">
      <rect x="-55" y="-18" width="110" height="50" rx="3" fill="rgba(200,164,70,0.05)" stroke="rgba(200,164,70,0.12)" stroke-width="0.5"/>
      <text x="0" y="-2" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#68687a" letter-spacing="1.5">KM CERTIFICATI</text>
      <text x="0" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#c8a446">38k</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-55" y="-18" width="110" height="50" rx="3" fill="rgba(200,164,70,0.05)" stroke="rgba(200,164,70,0.12)" stroke-width="0.5"/>
      <text x="0" y="-2" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#68687a" letter-spacing="1.5">PREZZO NL</text>
      <text x="0" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#c8a446">€36.800</text>
    </g>
    <g transform="translate(120, 0)">
      <rect x="-55" y="-18" width="110" height="50" rx="3" fill="rgba(200,164,70,0.05)" stroke="rgba(200,164,70,0.12)" stroke-width="0.5"/>
      <text x="0" y="-2" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#68687a" letter-spacing="1.5">IN ITALIA DA</text>
      <text x="0" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#e8e8f0">€44.000</text>
    </g>
  </g>
  <!-- Footer -->
  <line x1="60" y1="740" x2="740" y2="740" stroke="rgba(200,164,70,0.15)" stroke-width="0.5"/>
  <text x="400" y="770" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#a0a0b4" letter-spacing="2">Luca Ferretti · Vehicle Sourcing</text>
</svg>