<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c12"/>
      <stop offset="100%" stop-color="#06060a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a446"/>
      <stop offset="100%" stop-color="#e8c870"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="3" fill="url(#gold)" opacity="0.6"/>
  <!-- Title -->
  <text x="400" y="90" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="32" font-weight="300" fill="#e8e8f0">Come lavoro</text>
  <rect x="350" y="105" width="100" height="1" fill="url(#gold)" opacity="0.4"/>
  <!-- Step 1 -->
  <g transform="translate(400, 210)">
    <rect x="-280" y="-55" width="560" height="110" rx="6" fill="rgba(200,164,70,0.03)" stroke="rgba(200,164,70,0.12)" stroke-width="0.5"/>
    <text x="-240" y="-15" font-family="Georgia,serif" font-size="48" fill="rgba(200,164,70,0.08)">01</text>
    <text x="-165" y="-10" font-family="Georgia,serif" font-size="22" fill="#e8e8f0">Mi dici cosa cerchi</text>
    <text x="-165" y="18" font-family="'Courier New',monospace" font-size="10" fill="#68687a" letter-spacing="1">Brand, modello, anno, budget. In 24h attivo la ricerca</text>
    <text x="-165" y="36" font-family="'Courier New',monospace" font-size="10" fill="#68687a" letter-spacing="1">su 7 mercati europei.</text>
    <!-- Search icon -->
    <circle cx="220" cy="0" r="18" fill="none" stroke="#c8a446" stroke-width="1" opacity="0.4"/>
    <line x1="232" y1="12" x2="242" y2="22" stroke="#c8a446" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- Step 2 -->
  <g transform="translate(400, 390)">
    <rect x="-280" y="-55" width="560" height="110" rx="6" fill="rgba(200,164,70,0.03)" stroke="rgba(200,164,70,0.12)" stroke-width="0.5"/>
    <text x="-240" y="-15" font-family="Georgia,serif" font-size="48" fill="rgba(200,164,70,0.08)">02</text>
    <text x="-165" y="-10" font-family="Georgia,serif" font-size="22" fill="#e8e8f0">Verifico prima di proporti</text>
    <text x="-165" y="18" font-family="'Courier New',monospace" font-size="10" fill="#68687a" letter-spacing="1">Km, storico, prezzo di mercato, anomalie.</text>
    <text x="-165" y="36" font-family="'Courier New',monospace" font-size="10" fill="#68687a" letter-spacing="1">Se qualcosa non torna, non te la propongo.</text>
    <!-- Check icon -->
    <circle cx="220" cy="0" r="18" fill="none" stroke="#c8a446" stroke-width="1" opacity="0.4"/>
    <polyline points="210,-4 218,6 232,-8" fill="none" stroke="#c8a446" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- Step 3 -->
  <g transform="translate(400, 570)">
    <rect x="-280" y="-55" width="560" height="110" rx="6" fill="rgba(200,164,70,0.03)" stroke="rgba(200,164,70,0.12)" stroke-width="0.5"/>
    <text x="-240" y="-15" font-family="Georgia,serif" font-size="48" fill="rgba(200,164,70,0.08)">03</text>
    <text x="-165" y="-10" font-family="Georgia,serif" font-size="22" fill="#e8e8f0">Paghi solo a buon fine</text>
    <text x="-165" y="18" font-family="'Courier New',monospace" font-size="10" fill="#68687a" letter-spacing="1">Report completo con prezzo, trasporto, margine.</text>
    <text x="-165" y="36" font-family="'Courier New',monospace" font-size="10" fill="#68687a" letter-spacing="1">Se non ti convince, non mi devi nulla.</text>
    <!-- Euro icon -->
    <circle cx="220" cy="0" r="18" fill="none" stroke="#c8a446" stroke-width="1" opacity="0.4"/>
    <text x="220" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#c8a446" opacity="0.4">€</text>
  </g>
  <!-- Bottom CTA -->
  <g transform="translate(400, 730)">
    <rect x="-110" y="-16" width="220" height="32" rx="2" fill="rgba(200,164,70,0.1)" stroke="rgba(200,164,70,0.3)" stroke-width="0.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#c8a446" letter-spacing="2">€800-1.200 · SUCCESS FEE</text>
  </g>
  <!-- Footer -->
  <text x="400" y="785" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#68687a" letter-spacing="2">Luca Ferretti · Vehicle Sourcing</text>
</svg>