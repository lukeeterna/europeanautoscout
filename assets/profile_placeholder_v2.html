<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:720px;height:720px;background:linear-gradient(135deg,#06060a 0%,#0c0c12 40%,#12121a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;font-family:Arial,sans-serif}
.glow{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(200,164,70,.08) 0%,transparent 70%)}
.avatar{position:relative;z-index:2;width:280px;height:280px;border-radius:50%;border:2px solid rgba(200,164,70,.3);display:flex;align-items:center;justify-content:center;background:rgba(26,26,36,.6)}
.initials{font-family:Georgia,serif;font-size:100px;font-weight:normal;color:#e8e8f0;letter-spacing:-4px}
.name{position:relative;z-index:2;font-family:Georgia,serif;font-size:28px;color:#e8e8f0;margin-top:28px;letter-spacing:2px}
.role{position:relative;z-index:2;font-family:'Courier New',monospace;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#c8a446;margin-top:8px}
.line{width:60px;height:1px;background:#c8a446;margin-top:12px;position:relative;z-index:2}
</style></head><body>
<div class="glow"></div>
<div class="avatar">
<div class="initials">LF</div>
</div>
<div class="name">Luca Ferretti</div>
<div class="role">Vehicle Sourcing</div>
<div class="line"></div>
</body></html>
