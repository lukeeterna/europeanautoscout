<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060a"/>
      <stop offset="50%" stop-color="#0c0c12"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a446"/>
      <stop offset="100%" stop-color="#e8c870"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06060a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#06060a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="576" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#c8a446" stroke-width="0.5" fill="none">
    <line x1="0" y1="80" x2="1024" y2="80"/><line x1="0" y1="160" x2="1024" y2="160"/>
    <line x1="0" y1="240" x2="1024" y2="240"/><line x1="0" y1="320" x2="1024" y2="320"/>
    <line x1="0" y1="400" x2="1024" y2="400"/><line x1="0" y1="480" x2="1024" y2="480"/>
    <line x1="128" y1="0" x2="128" y2="576"/><line x1="256" y1="0" x2="256" y2="576"/>
    <line x1="384" y1="0" x2="384" y2="576"/><line x1="512" y1="0" x2="512" y2="576"/>
    <line x1="640" y1="0" x2="640" y2="576"/><line x1="768" y1="0" x2="768" y2="576"/>
    <line x1="896" y1="0" x2="896" y2="576"/>
  </g>
  <!-- Car silhouettes (abstract luxury SUV shapes) -->
  <g opacity="0.06" fill="#c8a446">
    <!-- Car 1 - left -->
    <rect x="80" y="260" width="280" height="100" rx="12"/>
    <rect x="100" y="230" width="230" height="50" rx="8"/>
    <circle cx="140" cy="370" r="22"/><circle cx="310" cy="370" r="22"/>
    <!-- Car 2 - right -->
    <rect x="660" y="240" width="300" height="110" rx="14"/>
    <rect x="690" y="208" width="240" height="52" rx="9"/>
    <circle cx="720" cy="360" r="24"/><circle cx="900" cy="360" r="24"/>
  </g>
  <!-- Central glow -->
  <ellipse cx="512" cy="288" rx="300" ry="200" fill="rgba(200,164,70,0.03)"/>
  <!-- Top accent line -->
  <rect x="0" y="0" width="1024" height="2" fill="url(#gold)" opacity="0.6"/>
  <!-- Left vertical accent -->
  <rect x="60" y="120" width="1" height="340" fill="url(#gold)" opacity="0.15"/>
  <!-- Main title area -->
  <text x="512" y="210" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="52" font-weight="300" fill="#e8e8f0" letter-spacing="6">LUCA FERRETTI</text>
  <!-- Divider -->
  <rect x="412" y="230" width="200" height="1" fill="url(#gold)" opacity="0.5"/>
  <!-- Subtitle -->
  <text x="512" y="268" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#c8a446" letter-spacing="6">VEHICLE SOURCING · MERCATI EU</text>
  <!-- Tagline -->
  <text x="512" y="320" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="22" font-weight="300" fill="#a0a0b4" font-style="italic">Veicoli premium dall'Europa per concessionari italiani</text>
  <!-- Bottom brand pills -->
  <g font-family="'Courier New',monospace" font-size="10" fill="#68687a" letter-spacing="2" text-anchor="middle">
    <text x="330" y="420">BMW</text>
    <text x="430" y="420">MERCEDES</text>
    <text x="540" y="420">AUDI</text>
    <text x="630" y="420">PORSCHE</text>
    <text x="730" y="420">LAND ROVER</text>
  </g>
  <!-- Dots separator -->
  <circle cx="380" cy="417" r="1.5" fill="#c8a446" opacity="0.3"/>
  <circle cx="485" cy="417" r="1.5" fill="#c8a446" opacity="0.3"/>
  <circle cx="585" cy="417" r="1.5" fill="#c8a446" opacity="0.3"/>
  <circle cx="680" cy="417" r="1.5" fill="#c8a446" opacity="0.3"/>
  <!-- Bottom line -->
  <rect x="0" y="574" width="1024" height="2" fill="url(#gold)" opacity="0.4"/>
  <!-- Contact info bottom right -->
  <text x="960" y="540" text-anchor="end" font-family="'Courier New',monospace" font-size="9" fill="#68687a" letter-spacing="1.5">+39 328 153 6308 · ferretti.argosautomotive@gmail.com</text>
  <!-- Success fee badge -->
  <g transform="translate(512, 470)">
    <rect x="-90" y="-14" width="180" height="28" rx="2" fill="none" stroke="rgba(200,164,70,0.25)" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#c8a446" letter-spacing="3">SUCCESS FEE · ZERO ANTICIPI</text>
  </g>
</svg>