<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:linear-gradient(135deg,#06060a 0%,#0c0c12 40%,#12121a 100%);font-family:Arial,sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(200,164,70,.06) 0%,transparent 70%);top:-100px;right:-50px}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(200,164,70,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(200,164,70,.015) 1px,transparent 1px);background-size:60px 60px;opacity:.6}
.content{position:relative;z-index:2;padding:60px;height:100%;display:flex;flex-direction:column;justify-content:center}
.name{font-family:Georgia,serif;font-size:52px;font-weight:normal;color:#e8e8f0;letter-spacing:2px}
.line{width:100px;height:2px;background:linear-gradient(90deg,#c8a446,transparent);margin:16px 0}
.subtitle{font-family:Georgia,serif;font-size:26px;color:#c8a446;font-style:italic;font-weight:normal}
.desc{font-size:16px;color:#68687a;margin-top:16px;max-width:600px;line-height:1.7}
.bottom{position:absolute;bottom:40px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
.brands{font-family:'Courier New',monospace;font-size:12px;letter-spacing:3px;color:#68687a;text-transform:uppercase}
.badge{font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#c8a446;border:1px solid rgba(200,164,70,.3);padding:8px 18px}
</style></head><body>
<div class="glow"></div>
<div class="grid"></div>
<div class="content">
<div class="name">Luca Ferretti</div>
<div class="line"></div>
<div class="subtitle">Vehicle Sourcing &mdash; Mercati EU</div>
<div class="desc">Veicoli premium dall'Europa per concessionari italiani.<br>Success fee: paghi solo a veicolo consegnato.</div>
</div>
<div class="bottom">
<div class="brands">BMW &middot; Mercedes &middot; Audi &middot; Porsche</div>
<div class="badge">Success Fee &middot; Zero Anticipi</div>
</div>
</body></html>
