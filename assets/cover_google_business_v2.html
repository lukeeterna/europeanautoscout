<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1332px;height:750px;background:linear-gradient(135deg,#06060a 0%,#0c0c12 40%,#12121a 100%);font-family:Arial,sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(200,164,70,.06) 0%,transparent 70%);top:-100px;right:-100px}
.glow2{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(200,164,70,.04) 0%,transparent 70%);bottom:-50px;left:100px}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(200,164,70,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(200,164,70,.02) 1px,transparent 1px);background-size:60px 60px;opacity:.5}
.content{position:relative;z-index:2;padding:80px 80px 60px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;flex-direction:column;gap:8px}
.name{font-family:Georgia,serif;font-size:52px;font-weight:normal;color:#e8e8f0;letter-spacing:2px}
.line{width:120px;height:2px;background:linear-gradient(90deg,#c8a446,transparent);margin:12px 0}
.subtitle{font-family:'Courier New',monospace;font-size:14px;letter-spacing:4px;text-transform:uppercase;color:#c8a446}
.brands{display:flex;gap:32px;margin-top:48px}
.brand{font-family:Georgia,serif;font-size:18px;color:#68687a;letter-spacing:3px;text-transform:uppercase;transition:color .3s}
.mid{display:flex;flex-direction:column;gap:16px}
.badge{display:inline-flex;align-items:center;gap:12px;border:1px solid rgba(200,164,70,.4);padding:12px 28px;align-self:flex-start}
.badge span{font-family:'Courier New',monospace;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#c8a446}
.badge-dot{width:6px;height:6px;background:#c8a446;border-radius:50%}
.bottom{display:flex;justify-content:space-between;align-items:flex-end}
.protocol{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;color:rgba(200,164,70,.3);text-transform:uppercase}
.contact{font-family:'Courier New',monospace;font-size:13px;color:#68687a;letter-spacing:1px}
.accent-line{position:absolute;left:0;top:0;width:3px;height:100%;background:linear-gradient(180deg,transparent 10%,#c8a446 50%,transparent 90%);opacity:.4}
</style></head><body>
<div class="glow"></div>
<div class="glow2"></div>
<div class="grid"></div>
<div class="accent-line"></div>
<div class="content">
<div class="top">
<div class="name">LUCA FERRETTI</div>
<div class="line"></div>
<div class="subtitle">Vehicle Sourcing &middot; Mercati EU</div>
<div class="brands">
<div class="brand">BMW</div>
<div class="brand">Mercedes</div>
<div class="brand">Audi</div>
<div class="brand">Porsche</div>
</div>
</div>
<div class="mid">
<div class="badge">
<div class="badge-dot"></div>
<span>Success Fee &middot; Zero Anticipi</span>
</div>
</div>
<div class="bottom">
<div class="protocol">Protocollo ARGOS &middot; Verifica indipendente</div>
<div class="contact">+39 328 153 6308</div>
</div>
</div>
</body></html>
