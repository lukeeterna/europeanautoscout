<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a446"/>
      <stop offset="100%" stop-color="#e8c870"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg)"/>
  <rect x="1" y="1" width="298" height="398" fill="none" stroke="rgba(200,164,70,0.12)" stroke-width="1"/>
  <!-- Avatar area -->
  <circle cx="150" cy="130" r="58" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.5"/>
  <circle cx="150" cy="112" r="24" fill="rgba(200,164,70,0.1)"/>
  <ellipse cx="150" cy="160" rx="35" ry="24" fill="rgba(200,164,70,0.1)"/>
  <!-- Initials large -->
  <text x="150" y="142" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="46" font-weight="300" fill="url(#gold)" letter-spacing="3">LF</text>
  <!-- Divider -->
  <line x1="110" y1="210" x2="190" y2="210" stroke="url(#gold)" stroke-width="0.7" opacity="0.4"/>
  <!-- Name -->
  <text x="150" y="244" text-anchor="middle" font-family="Georgia,'Cormorant Garamond',serif" font-size="20" font-weight="400" fill="#e8e8f0" letter-spacing="2.5">LUCA FERRETTI</text>
  <!-- Role -->
  <text x="150" y="268" text-anchor="middle" font-family="'Courier New',monospace" font-size="7.5" fill="#c8a446" letter-spacing="3">VEHICLE SOURCING SPECIALIST</text>
  <!-- Details -->
  <text x="150" y="298" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#68687a" letter-spacing="2">MERCATI EU · SUCCESS FEE</text>
  <text x="150" y="316" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#68687a" letter-spacing="2">BMW · MERCEDES · AUDI · PORSCHE</text>
  <!-- Bottom gold line -->
  <rect x="130" y="348" width="40" height="1" fill="url(#gold)" opacity="0.3"/>
  <!-- Corner accents -->
  <path d="M10,10 L28,10 M10,10 L10,28" stroke="url(#gold)" stroke-width="0.5" opacity="0.2" fill="none"/>
  <path d="M290,10 L272,10 M290,10 L290,28" stroke="url(#gold)" stroke-width="0.5" opacity="0.2" fill="none"/>
  <path d="M10,390 L28,390 M10,390 L10,372" stroke="url(#gold)" stroke-width="0.5" opacity="0.2" fill="none"/>
  <path d="M290,390 L272,390 M290,390 L290,372" stroke="url(#gold)" stroke-width="0.5" opacity="0.2" fill="none"/>
</svg>