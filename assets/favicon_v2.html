<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:512px;height:512px;background:#06060a;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(200,164,70,.1) 0%,transparent 70%)}
.icon{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:4px}
.letter{font-family:Georgia,serif;font-size:220px;font-weight:normal;color:#e8e8f0;line-height:1;letter-spacing:-8px}
.line{width:80px;height:3px;background:#c8a446}
</style></head><body>
<div class="glow"></div>
<div class="icon">
<div class="letter">LF</div>
<div class="line"></div>
</div>
</body></html>
