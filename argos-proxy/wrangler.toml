name = "argos-proxy"
main = "src/index.ts"
compatibility_date = "2025-03-19"
compatibility_flags = ["nodejs_compat"]

# Embed font TTF files in worker bundle (assets/fonts/*.ttf for pdf-lib signature embedding)
rules = [
  { type = "Data", globs = ["assets/fonts/*.ttf"], fallthrough = true }
]

# D1 — argos-contracts (filled by `wrangler d1 create argos-contracts`, see B-2)
# [[d1_databases]]
# binding = "DB"
# database_name = "argos-contracts"
# database_id = "<UUID-FROM-CREATE>"

# R2 — argos-contracts (filled after `wrangler r2 bucket create argos-contracts`)
# [[r2_buckets]]
# binding = "CONTRACTS"
# bucket_name = "argos-contracts"

[vars]
ENVIRONMENT = "test"

# Secrets (set via `wrangler secret put` — never commit):
# RESEND_API_KEY        — Resend free tier email delivery
# ARGOS_ADMIN_SECRET    — Bearer token admin endpoints (openssl rand -hex 32)
# R2_SIGNING_SECRET     — HMAC-SHA256 hex (32 bytes) for R2 signed URLs
# TELEGRAM_BOT_TOKEN    — re-use ARGOS bot
# TELEGRAM_CHAT_ID      — Luke chat
# ARGOS_IBAN            — IBAN MyTu/evolu (Luke shares via secure channel)
# ARGOS_INTESTATARIO    — account holder name (e.g. "Gianluca Di Stasi")
# WA_DAEMON_URL         — http://192.168.1.2:9191 (iMac LAN; production needs Tailscale)
# WA_DAEMON_API_KEY     — X-API-Key for daemon auth (per .claude/rules/security.md)
